  function pickAudioMimeType() {
    if (typeof MediaRecorder === "undefined") return "";
    const candidates = [
      "audio/mp4",
      "audio/mp4;codecs=mp4a.40.2",
      "audio/webm;codecs=opus",
      "audio/webm"
    ];
    for (const c of candidates) {
      if (MediaRecorder.isTypeSupported(c)) return c;
    }
    return "";
  }

  function startSpeechBackup() {
    speechFinalText = "";
    speechInterimText = "";
    if (callState !== "idle") return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    try {
      stopSpeechBackup();
      const rec = new SR();
      rec.lang = myRole === "ko" ? "ko-KR" : "vi-VN";
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (event) => {
        let fin = "";
        let interim = "";
        for (let i = 0; i < event.results.length; i++) {
          const res = event.results[i];
          const txt = (res[0] && res[0].transcript) ? res[0].transcript : "";
          if (res.isFinal) fin += txt + " ";
          else interim += txt;
        }
        speechFinalText = fin.trim();
        speechInterimText = interim.trim();
      };
      rec.onerror = () => {};
      rec.onend = () => {
        if (speechRec === rec) speechRec = null;
      };
      speechRec = rec;
      rec.start();
    } catch {
      speechRec = null;
    }
  }

  function getSpeechBackupText() {
    return `${speechFinalText} ${speechInterimText}`.trim();
  }

  function stopSpeechBackup() {
    if (speechRec) {
      const r = speechRec;
      speechRec = null;
      try { r.onresult = null; r.onerror = null; r.onend = null; r.stop(); } catch {}
    }
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      reportDiag("no_support");
      alert(t().diagNoSupport);
      return;
    }

    stopCurrentAudio();
    if (playbackAudioCtx && playbackAudioCtx.state === "running") {
      playbackAudioCtx.suspend().catch(() => {});
    }
    setMediaSessionState("playing", "Recording");

    // Pre-create & resume AudioContext inside direct user gesture before await getUserMedia
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        if (audioCtx && audioCtx.state !== "closed") {
          audioCtx.close().catch(() => {});
        }
        audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }
    } catch {
      audioCtx = null;
    }

    try {
      if ((callState === "active" || callState === "test" || callState === "outgoing") && localStream && localStream.getAudioTracks().length > 0) {
        try {
          const cloned = localStream.getAudioTracks()[0].clone();
          cloned.enabled = true;
          currentStream = new MediaStream([cloned]);
          stopStreamOnFinish = true;
        } catch {
          currentStream = new MediaStream([localStream.getAudioTracks()[0]]);
          stopStreamOnFinish = false;
        }
      } else {
        currentStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        stopStreamOnFinish = true;
      }

      if (myDiagCode === "mic_denied" || myDiagCode === "rec_err") {
        reportDiag(inAppName ? "in_app" : "");
      }

      const mimeType = pickAudioMimeType();
      const options = { audioBitsPerSecond: 64000 };
      if (mimeType) options.mimeType = mimeType;

      audioChunks = [];
      maxVolumePeak = 0;
      meterWasActive = false;
      lastChunkVolLevel = 0;
      lastChunkAt = 0;
      cancelRequested = false;
      recStartTime = Date.now();

      try {
        mediaRecorder = new MediaRecorder(currentStream, options);
      } catch {
        mediaRecorder = new MediaRecorder(currentStream);
      }
      const actualMime = (mediaRecorder.mimeType || mimeType || "audio/mp4").split(";")[0];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
          // Fallback reactive bar level from chunk byte size when AudioContext outputs flat samples
          const norm = Math.min(88, Math.max(12, Math.round((e.data.size / 1400) * 58)));
          lastChunkVolLevel = norm;
          lastChunkAt = Date.now();
        }
      };

      mediaRecorder.onstop = async () => {
        const backupTranscript = getSpeechBackupText();
        stopMeterAndStream();
        const duration = Date.now() - recStartTime;

        if (cancelRequested) {
          await finishTurnLock();
          return;
        }

        if (duration < 400 || audioChunks.length === 0) {
          statusEl.textContent = t().noVoice;
          statusEl.style.color = "#ff9800";
          setTimeout(updatePartnerStatusUI, 2500);
          await finishTurnLock();
          return;
        }

        const durationSec = Math.max(1, Math.round(duration / 1000));
        const audioBlob = new Blob(audioChunks, { type: actualMime });
        isProcessing = true;
        setProcessingStage("recognizing");
        await translateAudioAndBroadcast(audioBlob, actualMime, durationSec, backupTranscript);
      };

      startVolumeMeter(currentStream);

      try {
        mediaRecorder.start(250);
      } catch {
        mediaRecorder.start();
      }
      startSpeechBackup();
      isRecording = true;
      isMyTurn = false;
      updateButtonUI();

      await patchRoom({
        lockedBy: myRole,
        lockedAt: Date.now(),
        turnFor: "",
        turnAt: 0
      });
    } catch (err) {
      stopMeterAndStream();
      const isDenied = err.name === "NotAllowedError" || err.name === "PermissionDeniedError";
      reportDiag(isDenied ? "mic_denied" : "rec_err");
      alert(isDenied ? t().micDenied : `Mic Error: ${err.message}`);
    }
  }

  function startVolumeMeter(stream) {
    let flatFrames = 0;
    let didRetryAudioCtx = false;

    const attachAnalyser = (forceNew = false) => {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      if (forceNew && audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
      if (!audioCtx || audioCtx.state === "closed") {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      return true;
    };

    try {
      attachAnalyser(false);
    } catch {
      analyser = null;
    }

    const dataArr = new Uint8Array(256);
    const updateMeter = () => {
      if (!isRecording && !currentStream) return;
      let peak = 0;

      if (analyser && audioCtx) {
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        } else if (audioCtx.state === "running") {
          meterWasActive = true;
        }
        analyser.getByteTimeDomainData(dataArr);
        for (let i = 0; i < dataArr.length; i++) {
          const v = Math.abs(dataArr[i] - 128) / 128;
          if (v > peak) peak = v;
        }
      }

      if (peak > maxVolumePeak) maxVolumePeak = peak;

      if (peak < 0.004) {
        flatFrames++;
        if (flatFrames === 36 && !didRetryAudioCtx) {
          didRetryAudioCtx = true;
          try { attachAnalyser(true); } catch {}
        }
      } else {
        flatFrames = 0;
      }

      let pct = Math.min(100, Math.max(4, Math.round(peak * 220)));
      if (peak < 0.005 && lastChunkVolLevel > 0 && (Date.now() - lastChunkAt) < 700) {
        const wave = 0.78 + 0.22 * Math.abs(Math.sin(Date.now() / 140));
        pct = Math.min(92, Math.max(8, Math.round(lastChunkVolLevel * wave)));
      }
      volBar.style.width = pct + "%";
      meterRaf = requestAnimationFrame(updateMeter);
    };
    updateMeter();

    recTimer.textContent = "00:00";
    recTimerId = setInterval(() => {
      const sec = Math.floor((Date.now() - recStartTime) / 1000);
      recTimer.textContent = formatDuration(sec, true);
    }, 300);
  }

  function stopMeterAndStream() {
    stopSpeechBackup();
    if (meterRaf) { cancelAnimationFrame(meterRaf); meterRaf = null; }
    if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; analyser = null; }
    if (currentStream) {
      if (stopStreamOnFinish) currentStream.getTracks().forEach(tr => tr.stop());
      currentStream = null;
    }
    volBar.style.width = "4%";
    setMediaSessionState("none");
  }

  function cancelRecording() {
    if (!isRecording || !mediaRecorder) return;
    cancelRequested = true;
    isRecording = false;
    updateButtonUI();
    mediaRecorder.stop();
  }

  function finishRecording() {
    if (!isRecording || !mediaRecorder) return;
    cancelRequested = false;
    isRecording = false;
    updateButtonUI();
    mediaRecorder.stop();
  }

  async function finishTurnLock(extraPatch = {}) {
    const patch = { ...extraPatch, lockedBy: "", lockedAt: 0 };
    if (roomState.reservedBy && roomState.reservedBy !== myRole) {
      patch.turnFor = roomState.reservedBy;
      patch.turnAt = Date.now();
      patch.reservedBy = "";
    }
    await patchRoom(patch);
    isProcessing = false;
    setProcessingStage("idle");
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function normalizeAndTrimMessages(rawList) {
    const dedupMap = new Map();
    (rawList || []).forEach(m => {
      if (!m || typeof m !== "object") return;
      const { audioData, audioMime, ...rest } = m;
      if (rest.ts) dedupMap.set(rest.ts, rest);
    });
    const combined = Array.from(dedupMap.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const dropped = combined.length > MAX_STORED_MSGS ? combined.slice(0, combined.length - MAX_STORED_MSGS) : [];
    const updated = combined.slice(-MAX_STORED_MSGS);

    dropped.forEach(m => {
      if (m.hasAudio) {
        fetch(`${getAudioBaseUrl()}/${m.ts}.json`, { method: "DELETE" }).catch(() => {});
        delete audioCache[m.ts];
        idbDelete("audios", m.ts);
      }
      if (m.hasPhoto) {
        fetch(`${getPhotoBaseUrl()}/${m.ts}.json`, { method: "DELETE" }).catch(() => {});
        delete photoCache[m.ts];
        idbDelete("photos", m.ts);
      }
    });

    let audioCount = 0;
    let photoCount = 0;
    for (let i = updated.length - 1; i >= 0; i--) {
      if (updated[i].hasAudio) {
        audioCount++;
        if (audioCount > MAX_AUDIO_MSGS) {
          const ts = updated[i].ts;
          fetch(`${getAudioBaseUrl()}/${ts}.json`, { method: "DELETE" }).catch(() => {});
          delete audioCache[ts];
          idbDelete("audios", ts);
          updated[i] = { ...updated[i], hasAudio: false };
        }
      }
      if (updated[i].hasPhoto) {
        photoCount++;
        if (photoCount > MAX_PHOTO_MSGS) {
          const ts = updated[i].ts;
          fetch(`${getPhotoBaseUrl()}/${ts}.json`, { method: "DELETE" }).catch(() => {});
          delete photoCache[ts];
          idbDelete("photos", ts);
          updated[i] = { ...updated[i], hasPhoto: false, original: t().photoExpired, translated: t().photoExpired };
        }
      }
    }
    return updated;
  }

  function buildUpdatedMessages(newMsg) {
    return normalizeAndTrimMessages([...(roomState.messages || []), newMsg]);
  }

  function buildContextReference() {
    const recentMsgs = (roomState.messages || [])
      .filter(m => !m.hasPhoto && m.type !== "call_log" && m.original)
      .slice(-MAX_CONTEXT_MSGS);
    if (recentMsgs.length === 0) return "";
    const lines = recentMsgs.map(m => `- (${m.lang === "ko" ? "한→베" : "베→한"}) ${m.original} / ${m.translated}`);
    return `[이전 대화 문맥 참고]\n${lines.join("\n")}\n\n`;
  }

  async function translateAudioAndBroadcast(audioBlob, cleanMime, durationSec = 0, backupTranscript = "") {
    const msgTs = Date.now();

    try {
      setProcessingStage("recognizing");
      const sourceLang = myRole === "ko" ? "한국어" : "베트남어";
      const targetLang = myRole === "ko" ? "베트남어" : "한국어";
      const slCode = myRole === "ko" ? "ko" : "vi";
      const tlCode = myRole === "ko" ? "vi" : "ko";
      const fallbackText = (backupTranscript || "").trim();
      const preferGeminiAudio = (myRole === "vi" && callState === "idle");

      const runGeminiDirectAudio = async (base64Audio) => {
        setProcessingStage("translating");
        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 배경 음악, TV 소리, 주변 잡음은 철저히 무시하고 마이크에 가까이 말하는 화자의 ${sourceLang} 목소리만 정확하게 받아써.
- 일상 구어체, 짧은 추임새, 베트남어 성조를 이전 대화 문맥에 맞게 자연스럽게 보정해 인식하고, 반드시 ${targetLang}로 번역해. (절대 원문과 같은 언어로 번역하지 마)
- 화자의 말 없이 잡음·음악뿐이면 {"original": "", "translated": ""} 반환.
- 원문과 같은 문장 수 유지, 불필요한 설명 금지.
- 반드시 JSON으로만 응답: {"original": "${sourceLang} 원문", "translated": "자연스러운 구어체 ${targetLang} 번역문"}`;

        const contextText = buildContextReference();
        const contents = [
          {
            role: "user",
            parts: [
              { text: `${contextText}[현재 통역 지시: 배경 잡음은 무시하고 화자의 ${sourceLang} 음성을 정확히 받아쓴 뒤 반드시 ${targetLang}로 번역하세요]` },
              { inline_data: { mime_type: normalizeGeminiAudioMime(cleanMime), data: base64Audio } }
            ]
          }
        ];

        const data = await callGeminiWithFallback({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents,
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 350,
            responseMimeType: "application/json"
          }
        }, {
          baseTimeoutMs: 7000,
          fallbackTimeoutMs: 9000,
          onRetry: () => setProcessingStage("retrying")
        });

        const parts = data.candidates?.[0]?.content?.parts || [];
        let rawJson = "{}";
        for (const p of parts) {
          if (p.thought) continue;
          if (p.text) { rawJson = p.text.trim(); break; }
        }
        rawJson = rawJson.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
        const parsed = JSON.parse(rawJson);
        return {
          orig: (parsed.original || "").trim(),
          trans: (parsed.translated || "").trim()
        };
      };

      const runTextTranslation = async (recognizedOrig) => {
        setProcessingStage("translating");
        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 음성 인식으로 받아쓴 ${sourceLang} 구어체 문장이므로, 미세한 오탈자나 띄어쓰기는 자연스럽게 이해해 번역해. 특히 짧은 구어체에서 발음·성조 오인식으로 명백히 어색한 단어가 보일 때만 직전 대화 문맥을 참고해 자연스럽게 보정하고, 화제가 바뀐 정상 문장은 억지로 이전 문맥에 끼워 맞추지 마. 반드시 자연스러운 구어체 ${targetLang}로만 출력해. (절대 원문과 같은 언어로 출력하거나 설명을 덧붙이지 마)`;

        const contextText = buildContextReference();
        const userPrompt = `${contextText}[${sourceLang} → ${targetLang} 번역]\n${recognizedOrig}`;
        const contents = [
          {
            role: "user",
            parts: [
              { text: userPrompt }
            ]
          }
        ];

        try {
          const data = await callGeminiWithFallback({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents,
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 280
            }
          }, {
            baseTimeoutMs: 6000,
            fallbackTimeoutMs: 8000,
            onRetry: () => setProcessingStage("retrying")
          });

          const parts = data.candidates?.[0]?.content?.parts || [];
          for (const p of parts) {
            if (p.thought) continue;
            if (p.text && p.text.trim()) {
              return { trans: p.text.trim(), isUntranslated: false };
            }
          }
          throw new Error("empty");
        } catch {
          try {
            setProcessingStage("retrying");
            const groqTrans = await translateWithGroq(systemInstruction, userPrompt);
            if (!groqTrans) throw new Error("empty");
            return { trans: groqTrans, isUntranslated: false };
          } catch {
            try {
              const freeTrans = await translateWithFreeGoogle(recognizedOrig, slCode, tlCode);
              if (!freeTrans) throw new Error("empty");
              return { trans: freeTrans, isUntranslated: false };
            } catch {
              if (myRole === "vi") {
                return { trans: "", isUntranslated: true };
              }
              return { trans: recognizedOrig, isUntranslated: false };
            }
          }
        }
      };

      let base64Audio = "";
      let orig = "";
      let trans = "";
      let isUntranslated = false;

      if (preferGeminiAudio) {
        // 일반 채팅 베트남어: 1순위 Gemini 오디오 직접 청취 -> 실패 시 Groq whisper-large-v3 풀버전 자동 백업
        base64Audio = await blobToBase64(audioBlob);
        audioCache[msgTs] = { data: base64Audio, mime: cleanMime };
        idbPut("audios", { ts: msgTs, data: base64Audio, mime: cleanMime });

        let geminiDirectOk = false;
        try {
          const directRes = await runGeminiDirectAudio(base64Audio);
          geminiDirectOk = true;
          orig = directRes.orig;
          trans = directRes.trans;
        } catch {
          geminiDirectOk = false;
        }

        if (!orig && (!geminiDirectOk || maxVolumePeak > 0.02)) {
          setProcessingStage("retrying");
          const groqRes = await transcribeWithGroq(audioBlob, cleanMime, slCode);
          if (groqRes.ok && groqRes.text) {
            orig = groqRes.text;
          } else if (fallbackText) {
            orig = fallbackText;
          }

          if (orig) {
            const tr = await runTextTranslation(orig);
            trans = tr.trans;
            isUntranslated = tr.isUntranslated;
          } else if (!geminiDirectOk && !groqRes.ok) {
            throw new Error("all_stt_failed");
          }
        }
      } else {
        // 한국어(채팅/영통) & 베트남어 영통 중: 1순위 Groq Whisper (한: turbo / 베: large-v3 풀버전)
        const base64Promise = blobToBase64(audioBlob);
        const groqRes = await transcribeWithGroq(audioBlob, cleanMime, slCode);
        base64Audio = await base64Promise;

        audioCache[msgTs] = { data: base64Audio, mime: cleanMime };
        idbPut("audios", { ts: msgTs, data: base64Audio, mime: cleanMime });

        if (groqRes.ok && groqRes.text) {
          orig = groqRes.text;
        } else if (fallbackText) {
          orig = fallbackText;
        }

        if (orig) {
          const tr = await runTextTranslation(orig);
          trans = tr.trans;
          isUntranslated = tr.isUntranslated;
        } else if (!groqRes.ok || maxVolumePeak > 0.02) {
          const directRes = await runGeminiDirectAudio(base64Audio);
          orig = directRes.orig;
          trans = directRes.trans;
        }
      }

      if (!orig) {
        delete audioCache[msgTs];
        idbDelete("audios", msgTs);
        statusEl.textContent = t().noVoice;
        statusEl.style.color = "#ff9800";
        setTimeout(updatePartnerStatusUI, 2500);
        await finishTurnLock();
        return;
      }

      const newMsg = {
        lang: myRole,
        original: orig,
        translated: isUntranslated ? "" : (trans || orig),
        untranslated: isUntranslated,
        hasAudio: true,
        audioDuration: durationSec,
        hasPhoto: false,
        liked: false,
        replyTo: replyTarget ? { ...replyTarget } : null,
        ts: msgTs
      };
      clearReplyTarget();

      const updatedMessages = buildUpdatedMessages(newMsg);
      roomState.messages = updatedMessages;
      lastRenderSig = "";
      renderMessages(false);

      const syncTs = Date.now();
      await saveMessagesToDb(updatedMessages, syncTs, {
        upsertMsg: newMsg,
        skipPatchRoom: true,
        throwOnFail: true
      });
      await finishTurnLock({ lastMsgTs: syncTs });

      if (callState === "idle") {
        uploadAudioToFirebase(msgTs, base64Audio, cleanMime);
      } else {
        pendingCallAudios.push({ ts: msgTs, data: base64Audio, mime: cleanMime });
      }
    } catch (err) {
      roomState.messages = (roomState.messages || []).filter(m => m.ts !== msgTs);
      lastRenderSig = "";
      renderMessages(true);
      delete audioCache[msgTs];
      idbDelete("audios", msgTs);
      const isNetErr = (err && (err.message === "network_save_failed" || err.name === "TypeError"));
      alert(isNetErr ? t().errNetworkSend : t().errTranslateFail);
      await finishTurnLock();
    }
  }

  async function sendTextMessage() {
    const spokenText = textInput.value.trim();
    if (!spokenText || isProcessing || !apiKey) return;

    textInput.value = "";
    if (typingClearTimer) clearTimeout(typingClearTimer);
    patchRoom({ [`typing/${myRole}`]: 0 });

    isProcessing = true;
    setProcessingStage("translating");

    try {
      const sendRawWithoutTranslate = (myRole === "vi" && skipTextTranslate);
      let translated = "";
      let isUntranslated = false;

      if (sendRawWithoutTranslate) {
        isUntranslated = true;
      } else {
        const sourceLang = myRole === "ko" ? "한국어" : "베트남어";
        const targetLang = myRole === "ko" ? "베트남어" : "한국어";
        const slCode = myRole === "ko" ? "ko" : "vi";
        const tlCode = myRole === "ko" ? "vi" : "ko";

        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 반드시 입력된 ${sourceLang} 문장을 자연스러운 구어체 ${targetLang}로만 번역해서 출력해. (절대 원문과 같은 언어로 출력하거나 설명을 덧붙이지 마)`;

        const contextText = buildContextReference();
        const userPrompt = `${contextText}[${sourceLang} → ${targetLang} 번역]\n${spokenText}`;
        const contents = [
          {
            role: "user",
            parts: [
              { text: userPrompt }
            ]
          }
        ];

        try {
          const data = await callGeminiWithFallback({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents,
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 280
            }
          }, {
            baseTimeoutMs: 6000,
            fallbackTimeoutMs: 8000,
            onRetry: () => setProcessingStage("retrying")
          });

          const parts = data.candidates?.[0]?.content?.parts || [];
          for (const p of parts) {
            if (p.thought) continue;
            if (p.text) { translated = p.text.trim(); break; }
          }
          if (!translated) throw new Error("empty");
        } catch {
          try {
            setProcessingStage("retrying");
            translated = await translateWithGroq(systemInstruction, userPrompt);
            if (!translated) throw new Error("empty");
          } catch {
            try {
              translated = await translateWithFreeGoogle(spokenText, slCode, tlCode);
              if (!translated) throw new Error("empty");
            } catch {
              if (myRole === "vi") {
                isUntranslated = true;
                translated = "";
              } else {
                translated = spokenText;
              }
            }
          }
        }
      }

      const msgTs = Date.now();
      const newMsg = {
        lang: myRole,
        original: spokenText,
        translated: isUntranslated ? "" : (translated || spokenText),
        untranslated: isUntranslated,
        hasAudio: false,
        hasPhoto: false,
        liked: false,
        replyTo: replyTarget ? { ...replyTarget } : null,
        ts: msgTs
      };
      clearReplyTarget();

      const updatedMessages = buildUpdatedMessages(newMsg);
      roomState.messages = updatedMessages;
      lastRenderSig = "";
      renderMessages(false);

      const syncTs = Date.now();
      try {
        await saveMessagesToDb(updatedMessages, syncTs, { upsertMsg: newMsg, throwOnFail: true });
      } catch (saveErr) {
        roomState.messages = (roomState.messages || []).filter(m => m.ts !== msgTs);
        lastRenderSig = "";
        renderMessages(true);
        throw saveErr;
      }
    } catch (err) {
      if (!textInput.value.trim()) {
        textInput.value = spokenText;
      }
      const isNetErr = (err && (err.message === "network_save_failed" || err.name === "TypeError"));
      alert(isNetErr ? t().errNetworkSend : t().errTranslateFail);
    } finally {
      isProcessing = false;
      setProcessingStage("idle");
    }
  }
</script>
