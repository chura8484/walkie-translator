  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function buildUpdatedMessages(newMsg) {
    const cleaned = (roomState.messages || []).map(m => {
      const { audioData, audioMime, ...rest } = m;
      return rest;
    });
    const combined = [...cleaned, newMsg];
    const dropped = combined.length > MAX_STORED_MSGS ? combined.slice(0, combined.length - MAX_STORED_MSGS) : [];
    const updated = combined.slice(-MAX_STORED_MSGS);

    dropped.forEach(m => {
      if (m.hasAudio) {
        fetch(`${getAudioBaseUrl()}/${m.ts}.json`, { method: "DELETE" }).catch(() => {});
        delete audioCache[m.ts];
      }
      if (m.hasPhoto) {
        fetch(`${getPhotoBaseUrl()}/${m.ts}.json`, { method: "DELETE" }).catch(() => {});
        delete photoCache[m.ts];
      }
    });

    let audioCount = 0;
    let photoCount = 0;
    for (let i = updated.length - 1; i >= 0; i--) {
      if (updated[i].hasAudio) {
        audioCount++;
        if (audioCount > MAX_AUDIO_MSGS) {
          const ts = updated[i].ts;
          fetch(`${getAudioBaseUrl()}/${ts}.json`, { method: "DELETE" }).catch(() => {});
          delete audioCache[ts];
          updated[i] = { ...updated[i], hasAudio: false };
        }
      }
      if (updated[i].hasPhoto) {
        photoCount++;
        if (photoCount > MAX_PHOTO_MSGS) {
          const ts = updated[i].ts;
          fetch(`${getPhotoBaseUrl()}/${ts}.json`, { method: "DELETE" }).catch(() => {});
          delete photoCache[ts];
          updated[i] = { ...updated[i], hasPhoto: false, original: t().photoExpired, translated: t().photoExpired };
        }
      }
    }
    return updated;
  }

  function buildContextReference() {
    const recentMsgs = (roomState.messages || [])
      .filter(m => !m.hasPhoto && m.type !== "call_log" && m.original)
      .slice(-MAX_CONTEXT_MSGS);
    if (recentMsgs.length === 0) return "";
    const lines = recentMsgs.map(m => `- (${m.lang === "ko" ? "한→베" : "베→한"}) ${m.original} / ${m.translated}`);
    return `[이전 대화 문맥 참고]\n${lines.join("\n")}\n\n`;
  }

  async function translateAudioAndBroadcast(audioBlob, cleanMime, durationSec = 0) {
    const msgTs = Date.now();
    let audioUploaded = false;

    try {
      const base64Audio = await blobToBase64(audioBlob);
      const sourceLang = myRole === "ko" ? "한국어" : "베트남어";
      const targetLang = myRole === "ko" ? "베트남어" : "한국어";

      audioCache[msgTs] = { data: base64Audio, mime: cleanMime };
      const audioUploadPromise = fetch(`${getAudioBaseUrl()}/${msgTs}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: base64Audio, mime: cleanMime })
      }).then(() => { audioUploaded = true; }).catch(() => {});

      const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 반드시 ${sourceLang} 오디오를 받아쓰고, 반드시 ${targetLang}로 번역해. (절대 원문과 같은 언어로 번역하지 마)
- 사람의 말이 없거나 잡음뿐이면 {"original": "", "translated": ""} 반환.
- 원문과 같은 문장 수 유지, 불필요한 설명 금지.
- 반드시 JSON으로만 응답: {"original": "${sourceLang} 원문", "translated": "자연스러운 구어체 ${targetLang} 번역문"}`;

      const contextText = buildContextReference();
      const contents = [
        {
          role: "user",
          parts: [
            { text: `${contextText}[현재 통역 지시: 아래 ${sourceLang} 음성을 받아쓰고 반드시 ${targetLang}로 번역하세요]` },
            { inline_data: { mime_type: cleanMime, data: base64Audio } }
          ]
        }
      ];

      const data = await callGeminiWithFallback({
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents,
        generationConfig: {
          temperature: 0.2,
          maxOutputTokens: 350,
          responseMimeType: "application/json",
          thinkingConfig: { thinkingBudget: 0 }
        }
      }, 5000, 10000);

      const parts = data.candidates?.[0]?.content?.parts || [];
      let rawJson = "{}";
      for (const p of parts) {
        if (p.thought) continue;
        if (p.text) { rawJson = p.text.trim(); break; }
      }

      const parsed = JSON.parse(rawJson);
      const orig = (parsed.original || "").trim();
      const trans = (parsed.translated || "").trim();

      if (!orig) {
        delete audioCache[msgTs];
        audioUploadPromise.then(() => {
          fetch(`${getAudioBaseUrl()}/${msgTs}.json`, { method: "DELETE" }).catch(() => {});
        });
        statusEl.textContent = t().noVoice;
        statusEl.style.color = "#ff9800";
        setTimeout(updatePartnerStatusUI, 2500);
        await finishTurnLock();
        return;
      }

      const newMsg = {
        lang: myRole,
        original: orig,
        translated: trans || orig,
        hasAudio: true,
        audioDuration: durationSec,
        hasPhoto: false,
        liked: false,
        replyTo: replyTarget ? { ...replyTarget } : null,
        ts: msgTs
      };
      clearReplyTarget();

      const updatedMessages = buildUpdatedMessages(newMsg);
      roomState.messages = updatedMessages;
      lastRenderSig = "";
      renderMessages(false);

      const syncTs = Date.now();
      loadedMsgSyncTs = syncTs;
      pendingSaveCount++;
      try {
        await fetch(`${getMsgsBaseUrl()}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedMessages)
        });
        await finishTurnLock({ lastMsgTs: syncTs });
      } finally {
        pendingSaveCount = Math.max(0, pendingSaveCount - 1);
      }
    } catch (err) {
      delete audioCache[msgTs];
      if (audioUploaded) {
        fetch(`${getAudioBaseUrl()}/${msgTs}.json`, { method: "DELETE" }).catch(() => {});
      }
      alert("Error: " + err.message);
      await finishTurnLock();
    }
  }

  async function sendTextMessage() {
    const spokenText = textInput.value.trim();
    if (!spokenText || isProcessing || !apiKey) return;

    textInput.value = "";
    if (typingClearTimer) clearTimeout(typingClearTimer);
    patchRoom({ [`typing/${myRole}`]: 0 });

    isProcessing = true;
    updateButtonUI();

    try {
      const sourceLang = myRole === "ko" ? "한국어" : "베트남어";
      const targetLang = myRole === "ko" ? "베트남어" : "한국어";
      const slCode = myRole === "ko" ? "ko" : "vi";
      const tlCode = myRole === "ko" ? "vi" : "ko";

      const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 반드시 입력된 ${sourceLang} 문장을 자연스러운 구어체 ${targetLang}로만 번역해서 출력해. (절대 원문과 같은 언어로 출력하거나 설명을 덧붙이지 마)`;

      const contextText = buildContextReference();
      const contents = [
        {
          role: "user",
          parts: [
            { text: `${contextText}[${sourceLang} → ${targetLang} 번역]\n${spokenText}` }
          ]
        }
      ];

      let translated = "";
      try {
        const data = await callGeminiWithFallback({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents,
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 280,
            thinkingConfig: { thinkingBudget: 0 }
          }
        }, 3000, 5000);

        const parts = data.candidates?.[0]?.content?.parts || [];
        for (const p of parts) {
          if (p.thought) continue;
          if (p.text) { translated = p.text.trim(); break; }
        }
      } catch {
        translated = await translateWithFreeGoogle(spokenText, slCode, tlCode);
      }

      const newMsg = {
        lang: myRole,
        original: spokenText,
        translated: translated || spokenText,
        hasAudio: false,
        hasPhoto: false,
        liked: false,
        replyTo: replyTarget ? { ...replyTarget } : null,
        ts: Date.now()
      };
      clearReplyTarget();

      const updatedMessages = buildUpdatedMessages(newMsg);
      roomState.messages = updatedMessages;
      lastRenderSig = "";
      renderMessages(false);

      const syncTs = Date.now();
      loadedMsgSyncTs = syncTs;
      await saveMessagesToDb(updatedMessages, syncTs);
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      isProcessing = false;
      updateButtonUI();
    }
  }
</script>
