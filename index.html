    }, 9000);
  }

  function handleIncomingEmojiBurst(burstMap) {
    const otherList = Array.isArray(burstMap?.[getOtherRole()]) ? burstMap[getOtherRole()] : [];
    const now = Date.now();

    if (!emojiInitialized) {
      otherList.forEach(ev => { if (ev && ev.id) seenEmojiIds.add(ev.id); });
      emojiInitialized = true;
      return;
    }

    const fresh = otherList.filter(ev => ev && ev.id && !seenEmojiIds.has(ev.id) && (now - ev.ts < 8000));
    fresh.forEach((ev, idx) => {
      seenEmojiIds.add(ev.id);
      setTimeout(() => triggerEmojiEffect(ev.emoji), idx * 120);
    });

    if (seenEmojiIds.size > 100) {
      seenEmojiIds = new Set(Array.from(seenEmojiIds).slice(-50));
    }
  }

  /* ================= 영상통화 상시 실시간 낙서 ================= */

  function downsamplePoints(points, maxCount = 140) {
    if (!points || points.length <= maxCount) return points;
    const result = [];
    const step = (points.length - 1) / (maxCount - 1);
    for (let i = 0; i < maxCount; i++) {
      result.push(points[Math.round(i * step)]);
    }
    return result;
  }

  function resizeDoodleCanvas() {
    const w = doodleCanvas.clientWidth;
    const h = doodleCanvas.clientHeight;
    if (w > 0 && h > 0 && (doodleCanvas.width !== w || doodleCanvas.height !== h)) {
      doodleCanvas.width = w;
      doodleCanvas.height = h;
    }
  }

  window.addEventListener("resize", resizeDoodleCanvas);

  function startDoodleLoop() {
    if (doodleRaf) return;
    const step = () => {
      resizeDoodleCanvas();
      const ctx = doodleCanvas.getContext("2d");
      const w = doodleCanvas.width;
      const h = doodleCanvas.height;
      ctx.clearRect(0, 0, w, h);

      const now = Date.now();
      const HOLD_MS = 1500;
      const FADE_MS = 1000;

      activeDoodles = activeDoodles.filter(st => (now - st.createdAt) < (HOLD_MS + FADE_MS));

      const drawStroke = (points, color, alpha) => {
        if (!points || points.length < 2) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(points[0][0] * w, points[0][1] * h);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i][0] * w, points[i][1] * h);
        }
        ctx.stroke();
        ctx.restore();
      };

      activeDoodles.forEach(st => {
        const age = now - st.createdAt;
        const alpha = age <= HOLD_MS ? 1 : Math.max(0, 1 - (age - HOLD_MS) / FADE_MS);
        drawStroke(st.points, st.color, alpha);
      });

      if (currentDoodleStroke && currentDoodleStroke.points.length >= 2) {
        drawStroke(currentDoodleStroke.points, currentDoodleStroke.color, 1);
      }

      if (activeDoodles.length > 0 || currentDoodleStroke) {
        doodleRaf = requestAnimationFrame(step);
      } else {
        doodleRaf = null;
      }
    };
    doodleRaf = requestAnimationFrame(step);
  }

  doodleCanvas.addEventListener("pointerdown", (e) => {
    if (callState !== "active" && callState !== "test" && callState !== "outgoing") return;
    resizeDoodleCanvas();
    const rect = doodleCanvas.getBoundingClientRect();
    const nx = Number(((e.clientX - rect.left) / rect.width).toFixed(3));
    const ny = Number(((e.clientY - rect.top) / rect.height).toFixed(3));
    doodlePointerId = e.pointerId;
    doodleTotalDist = 0;

    if (callState === "active" || callState === "test") {
      currentDoodleStroke = {
        points: [[nx, ny]],
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        color: myRole === "ko" ? "#00e5ff" : "#ff4081"
      };
      startDoodleLoop();
    } else {
      currentDoodleStroke = {
        points: [],
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        color: ""
      };
    }
    doodleCanvas.setPointerCapture(e.pointerId);
  });

  doodleCanvas.addEventListener("pointermove", (e) => {
    if (!currentDoodleStroke || e.pointerId !== doodlePointerId) return;
    const dx = e.clientX - currentDoodleStroke.lastClientX;
    const dy = e.clientY - currentDoodleStroke.lastClientY;
    const dist = Math.hypot(dx, dy);
    if (dist < 4) return;
    doodleTotalDist += dist;
    currentDoodleStroke.lastClientX = e.clientX;
    currentDoodleStroke.lastClientY = e.clientY;

    if (callState === "active" || callState === "test") {
      const rect = doodleCanvas.getBoundingClientRect();
      const nx = Number(((e.clientX - rect.left) / rect.width).toFixed(3));
      const ny = Number(((e.clientY - rect.top) / rect.height).toFixed(3));
      currentDoodleStroke.points.push([nx, ny]);
    }
  });

  function finishDoodleStroke(e) {
    if (!currentDoodleStroke || (e && e.pointerId !== doodlePointerId)) return;
    const finished = currentDoodleStroke;
    currentDoodleStroke = null;
    doodlePointerId = null;

    if (doodleTotalDist < 14) {
      if (isVideoFull) {
        isVideoMenuOpen = !isVideoMenuOpen;
        document.body.classList.toggle("video-menu-open", isVideoMenuOpen);
      }
      return;
    }

    if ((callState === "active" || callState === "test") && finished.points.length >= 3) {
      const now = Date.now();
      activeDoodles.push({ points: finished.points, color: finished.color, createdAt: now });
      startDoodleLoop();

      if (callState === "active" && roomPass) {
        const id = `${now}_${Math.random().toString(36).slice(2, 6)}`;
        const compactPoints = downsamplePoints(finished.points, 140);
        myDoodleEvents = myDoodleEvents.filter(d => now - d.ts < 8000);
        myDoodleEvents.push({ id, points: compactPoints, color: finished.color, ts: now });
        if (myDoodleEvents.length > 6) myDoodleEvents = myDoodleEvents.slice(-6);
        patchRoom({ [`doodleBurst/${myRole}`]: myDoodleEvents });

        if (doodleClearTimer) clearTimeout(doodleClearTimer);
        doodleClearTimer = setTimeout(() => {
          myDoodleEvents = [];
          if (roomPass) patchRoom({ [`doodleBurst/${myRole}`]: null });
        }, 9000);
      }
    }
  }

  doodleCanvas.addEventListener("pointerup", finishDoodleStroke);
  doodleCanvas.addEventListener("pointercancel", finishDoodleStroke);

  function handleIncomingDoodleBurst(burstMap) {
    const otherList = Array.isArray(burstMap?.[getOtherRole()]) ? burstMap[getOtherRole()] : [];
    const now = Date.now();

    if (!doodleInitialized) {
      otherList.forEach(ev => { if (ev && ev.id) seenDoodleIds.add(ev.id); });
      doodleInitialized = true;
      return;
    }

    if (callState !== "active") return;

    const fresh = otherList.filter(ev => ev && ev.id && !seenDoodleIds.has(ev.id) && (now - ev.ts < 8000));
    if (fresh.length > 0) {
      fresh.forEach(ev => {
        seenDoodleIds.add(ev.id);
        activeDoodles.push({
          points: ev.points,
          color: ev.color || "#ff4081",
          createdAt: Date.now()
        });
      });
      startDoodleLoop();
    }

    if (seenDoodleIds.size > 100) {
      seenDoodleIds = new Set(Array.from(seenDoodleIds).slice(-50));
    }
  }

  /* ================= 메시지 렌더링 ================= */

  function renderMessages(preserveScroll = false) {
    const msgs = roomState.messages || [];
    const total = msgs.length;
    const startIdx = Math.max(0, total - visibleMsgCount);
    const visibleSlice = msgs.slice(startIdx);

    const sig = buildRenderSig();
    if (sig === lastRenderSig) return;
    lastRenderSig = sig;

    const prevScrollTop = subtitlesEl.scrollTop;
    const latest = msgs[msgs.length - 1];
    const hasNewMsg = Boolean(latest && latest.ts && latest.ts > lastRenderedLatestTs);
    if (latest && latest.ts) lastRenderedLatestTs = Math.max(lastRenderedLatestTs, latest.ts);

    const allowPhotoAutoScroll = !preserveScroll || hasNewMsg;

    subtitlesEl.innerHTML = "";

    if (startIdx > 0) {
      const hint = document.createElement("div");
      hint.className = "load-more-hint";
      hint.textContent = `${t().loadMore} (${startIdx})`;
      hint.onclick = loadMoreMessages;
      subtitlesEl.appendChild(hint);
    }

    let lastDateKey = "";

    visibleSlice.forEach(m => {
      if (m.ts) {
        const dk = formatDateKey(m.ts);
        if (dk !== lastDateKey) {
          lastDateKey = dk;
          const divDate = document.createElement("div");
          divDate.className = "date-divider";
          divDate.textContent = formatDateDivider(m.ts);
          subtitlesEl.appendChild(divDate);
        }
      }

      if (m.type === "call_log") {
        const pill = document.createElement("div");
        pill.className = "call-log-pill";
        const durText = formatDuration(m.durationSec || 0, true);
        pill.innerHTML = `<span>${t().callLogLabel} (${durText})</span><span class="call-log-time">${formatMsgTime(m.ts)}</span>`;
        subtitlesEl.appendChild(pill);
        return;
      }

      const isMine = (m.lang === myRole);
      const isPlayingThis = (currentPlayingTs === m.ts);
      const div = document.createElement("div");
      div.className = `bubble ${isMine ? "mine" : "other"}`;
      div.dataset.ts = String(m.ts);

      if (m.replyTo && m.replyTo.text) {
        const quoteDiv = document.createElement("div");
        quoteDiv.className = "reply-quote";
        quoteDiv.textContent = `↩ ${m.replyTo.text}`;
        div.appendChild(quoteDiv);
      }

      if (m.hasPhoto) {
        const photoWrap = document.createElement("div");
        photoWrap.className = "msg-photo-wrap";

        const placeholder = document.createElement("div");
        placeholder.className = "photo-loading";
        placeholder.textContent = t().photoLoading;

        const img = document.createElement("img");
        img.className = "msg-photo hidden";
        img.onclick = () => openPhotoModal(m.ts);

        photoWrap.appendChild(placeholder);
        photoWrap.appendChild(img);
        div.appendChild(photoWrap);
        loadPhotoIntoImg(m.ts, img, placeholder, allowPhotoAutoScroll);
      } else {
        const topDiv = document.createElement("div");
        topDiv.className = "bubble-top";

        const transDiv = document.createElement("div");
        transDiv.className = "translated";
        const origDiv = document.createElement("div");
        origDiv.className = "original";

        if (m.untranslated) {
          if (isMine) {
            transDiv.textContent = m.original || "";
            origDiv.textContent = t().waitingPartnerTranslate;
          } else if (translatingIncomingSet.has(m.ts)) {
            transDiv.textContent = t().micTranslating;
            origDiv.textContent = m.original || "";
          } else {
            transDiv.textContent = m.original || "";
            origDiv.textContent = t().untranslatedHint;
          }
        } else {
          transDiv.textContent = m.translated || "";
          origDiv.textContent = m.original || "";
        }
        topDiv.appendChild(transDiv);

        if (m.hasAudio || (m.audioData && m.audioMime)) {
          const durSec = m.audioDuration || audioDurationCache[m.ts] || 0;
          const playBtn = document.createElement("button");
          playBtn.className = "play-btn" + (isPlayingThis ? " playing" : "");
          playBtn.dataset.ts = String(m.ts);
          playBtn.dataset.dur = String(durSec);
          playBtn.innerHTML = buildPlayBtnHTML(isPlayingThis, durSec);
          playBtn.onclick = () => toggleAudio(m);
          topDiv.appendChild(playBtn);
        }

        div.appendChild(topDiv);
        div.appendChild(origDiv);
      }

      const footerDiv = document.createElement("div");
      footerDiv.className = "bubble-footer";

      const timeDiv = document.createElement("div");
      timeDiv.className = "msg-time";
      timeDiv.textContent = m.ts ? formatMsgTime(m.ts) : "";
      footerDiv.appendChild(timeDiv);

      const actDiv = document.createElement("div");
      actDiv.className = "msg-actions";

      if (isMine && !m.hasPhoto && m.original && !m.untranslated) {
        const retransBtn = document.createElement("button");
        retransBtn.className = "msg-act-btn";
        retransBtn.textContent = "🔄";
        retransBtn.onclick = () => retranslateMessage(m.ts, retransBtn);
        actDiv.appendChild(retransBtn);
      }

      if (!isMine && !m.hasPhoto && m.original && m.untranslated) {
        const transBtn = document.createElement("button");
        transBtn.className = "msg-act-btn";
        transBtn.textContent = "🌐";
        transBtn.onclick = () => translateIncomingMessageByTs(m.ts, true);
        actDiv.appendChild(transBtn);
      }

      const replyBtn = document.createElement("button");
      replyBtn.className = "msg-act-btn";
      replyBtn.textContent = "↩";
      replyBtn.onclick = () => setReplyTarget(m);
      actDiv.appendChild(replyBtn);

      if (isMine) {
        const delBtn = document.createElement("button");
        delBtn.className = "msg-act-btn";
        delBtn.textContent = "🗑️";
        delBtn.onclick = () => deleteMyMessage(m.ts);
        actDiv.appendChild(delBtn);
      }

      footerDiv.appendChild(actDiv);
      div.appendChild(footerDiv);

      if (!isMine) {
        const heartBtn = document.createElement("button");
        heartBtn.className = "msg-heart-btn" + (m.liked ? " liked" : "");
        heartBtn.textContent = m.liked ? "❤️" : "🤍";
        heartBtn.onclick = () => toggleMessageHeart(m.ts, heartBtn);
        div.appendChild(heartBtn);
      } else if (m.liked) {
        const heartBadge = document.createElement("div");
        heartBadge.className = "msg-heart-badge";
        heartBadge.textContent = "❤️";
        div.appendChild(heartBadge);
      }

      subtitlesEl.appendChild(div);
    });

    if (preserveScroll && !hasNewMsg) {
      subtitlesEl.scrollTop = prevScrollTop;
    } else {
      scrollToBottom(false);
    }

    if (latest && latest.ts && latest.ts > lastOverlayMsgTs) {
      lastOverlayMsgTs = latest.ts;
      if ((callState === "active" || callState === "test" || callState === "outgoing") && isVideoFull && !latest.hasPhoto && latest.type !== "call_log") {
        showVideoSubtitle(latest);
      }
    }
  }

  function updatePlayButtonVisual(ts, isPlaying, durSecOverride) {
    const btn = subtitlesEl.querySelector(`.play-btn[data-ts="${ts}"]`);
    if (!btn) return;
    const dur = durSecOverride !== undefined ? durSecOverride : Number(btn.dataset.dur || audioDurationCache[ts] || 0);
    if (dur > 0) btn.dataset.dur = String(dur);
    btn.classList.toggle("playing", isPlaying);
    btn.innerHTML = buildPlayBtnHTML(isPlaying, dur);
  }

  function stopCurrentAudio() {
    if (currentAudioEl) {
      currentAudioEl.pause();
      currentAudioEl = null;
    }
    if (currentPlayingTs !== null) {
      const prevTs = currentPlayingTs;
      currentPlayingTs = null;
      updatePlayButtonVisual(prevTs, false);
    }
    setMediaSessionState("none");
  }

  async function toggleAudio(msg) {
    if (currentPlayingTs === msg.ts) {
      stopCurrentAudio();
      return;
    }
    stopCurrentAudio();

    const targetTs = msg.ts;
    currentPlayingTs = targetTs;

    try {
      let cached = audioCache[targetTs];
      if (!cached && msg.audioData && msg.audioMime) {
        cached = { data: msg.audioData, mime: msg.audioMime };
        audioCache[targetTs] = cached;
      }
      if (!cached) {
        const fromIdb = await idbGet("audios", targetTs);
        if (fromIdb && fromIdb.data) {
          cached = { data: fromIdb.data, mime: fromIdb.mime };
          audioCache[targetTs] = cached;
        }
      }
      if (!cached) {
        const liveBtn = subtitlesEl.querySelector(`.play-btn[data-ts="${targetTs}"]`);
        if (liveBtn) liveBtn.textContent = "⏳";
        const res = await fetch(`${getAudioBaseUrl()}/${targetTs}.json`);
        if (!res.ok) throw new Error("audio fetch failed");
        cached = await res.json();
        if (!cached || !cached.data) {
          currentPlayingTs = null;
          updatePlayButtonVisual(targetTs, false);
          if (callState === "idle" && (Date.now() - targetTs > 15000)) {
            const b = subtitlesEl.querySelector(`.play-btn[data-ts="${targetTs}"]`);
            if (b) b.classList.add("hidden");
            await markAudioUnavailable(targetTs);
          }
          return;
        }
        audioCache[targetTs] = cached;
        idbPut("audios", { ts: targetTs, data: cached.data, mime: cached.mime });
      }

      if (currentPlayingTs !== targetTs) return;

      const audio = new Audio(`data:${cached.mime};base64,${cached.data}`);
      audio.volume = 1.0;
      currentAudioEl = audio;

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          if (!playbackAudioCtx || playbackAudioCtx.state === "closed") {
            playbackAudioCtx = new AudioContextClass();
          }
          if (playbackAudioCtx.state === "suspended") {
            await playbackAudioCtx.resume();
          }
          const source = playbackAudioCtx.createMediaElementSource(audio);
          const gainNode = playbackAudioCtx.createGain();
          gainNode.gain.value = VOICE_BOOST_GAIN;
          source.connect(gainNode);
          gainNode.connect(playbackAudioCtx.destination);
        }
      } catch {}

      const knownDur = msg.audioDuration || audioDurationCache[targetTs] || 0;
      updatePlayButtonVisual(targetTs, true, knownDur);
      setMediaSessionState("playing", "Voice Message");

      audio.onloadedmetadata = () => {
        if (isFinite(audio.duration) && audio.duration > 0) {
          const sec = Math.max(1, Math.round(audio.duration));
          audioDurationCache[targetTs] = sec;
          updatePlayButtonVisual(targetTs, currentPlayingTs === targetTs, sec);
        }
      };

      audio.onended = () => stopCurrentAudio();
      audio.onerror = () => stopCurrentAudio();
      audio.play().catch(() => stopCurrentAudio());
    } catch {
      stopCurrentAudio();
    }
  }

  async function patchRoom(partial) {
    try {
      await fetch(`${getRoomBaseUrl()}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(partial)
      });
    } catch {}
  }

  function coerceMessageArray(raw) {
    if (Array.isArray(raw)) return raw.filter(m => m && typeof m === "object");
    if (raw && typeof raw === "object") {
      return Object.values(raw).filter(m => m && typeof m === "object");
    }
    return [];
  }

  async function fetchServerMessagesWithRetry() {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetchWithTimeout(`${getMsgsBaseUrl()}.json`, { method: "GET" }, 6000);
        if (res.ok) {
          const data = await res.json();
          return { ok: true, messages: data === null ? [] : coerceMessageArray(data) };
        }
      } catch {}
      if (attempt === 0) await sleepMs(400);
    }
    return { ok: false, messages: null };
  }

  async function saveMessagesToDb(updatedMessages, syncTs, opts = {}) {
    pendingSaveCount++;
    try {
      const serverRes = await fetchServerMessagesWithRetry();
      if (!serverRes.ok) {
        if (opts.throwOnFail) throw new Error("network_save_failed");
        return false;
      }

      const msgMap = new Map();
      serverRes.messages.forEach(m => {
        if (m && m.ts) msgMap.set(m.ts, m);
      });

      if (opts.deletedTs) {
        msgMap.delete(opts.deletedTs);
      } else if (opts.upsertMsg && opts.upsertMsg.ts) {
        msgMap.set(opts.upsertMsg.ts, opts.upsertMsg);
      } else {
        coerceMessageArray(updatedMessages).forEach(m => {
          if (m && m.ts) msgMap.set(m.ts, m);
        });
      }

      const mergedMessages = normalizeAndTrimMessages(Array.from(msgMap.values()));

      const putRes = await fetchWithTimeout(`${getMsgsBaseUrl()}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(mergedMessages)
      }, 7000);

      if (!putRes.ok) {
        if (opts.throwOnFail) throw new Error("network_save_failed");
        return false;
      }

      roomState.messages = mergedMessages;
      loadedMsgSyncTs = syncTs;
      lastRenderSig = "";
      renderMessages(true);

      if (!opts.skipPatchRoom) {
        await patchRoom({ lastMsgTs: syncTs });
      }
      return true;
    } catch (err) {
      if (opts.throwOnFail) throw err;
      return false;
    } finally {
      pendingSaveCount = Math.max(0, pendingSaveCount - 1);
    }
  }

  async function appendCallLogMessage(callId, durationSec, checkServerFirst = false) {
    if (!callId || durationSec < 1) return;

    try {
      if (checkServerFirst) {
        const serverRes = await fetchServerMessagesWithRetry();
        if (serverRes.ok) {
          roomState.messages = serverRes.messages;
        }
      }

      if ((roomState.messages || []).some(m => m.type === "call_log" && m.callId === callId)) return;

      const logMsg = {
        type: "call_log",
        callId,
        durationSec,
        lang: myRole,
        ts: Date.now()
      };
      const updatedMessages = buildUpdatedMessages(logMsg);
      roomState.messages = updatedMessages;
      lastRenderSig = "";
      renderMessages(false);

      const syncTs = Date.now();
      loadedMsgSyncTs = syncTs;
      await saveMessagesToDb(updatedMessages, syncTs, { upsertMsg: logMsg });
    } catch {}
  }

  async function fetchMessagesFromDb(legacyMessages, targetSyncTs) {
    if (isFetchingMsgs || pendingSaveCount > 0) return;
    isFetchingMsgs = true;
    const isInitialLoad = (loadedMsgSyncTs === -1);
    const prevLikedMine = new Set(
      (roomState.messages || []).filter(m => m.lang === myRole && m.liked).map(m => m.ts)
    );

    try {
      const res = await fetchWithTimeout(`${getMsgsBaseUrl()}.json`, { method: "GET" }, 6000);
      if (!res.ok) return;
      const rawFetched = await res.json();
      if (pendingSaveCount > 0) return;

      const fetched = rawFetched === null ? [] : coerceMessageArray(rawFetched);

      if (fetched.length > 0) {
        roomState.messages = fetched;
      } else if (Array.isArray(legacyMessages) && legacyMessages.length > 0) {
        roomState.messages = legacyMessages;
        const ts = Date.now();
        await fetchWithTimeout(`${getMsgsBaseUrl()}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(legacyMessages)
        }, 7000);
        await patchRoom({ lastMsgTs: ts, messages: null });
        targetSyncTs = ts;
      } else if (rawFetched === null) {
        roomState.messages = [];
      }

      if (!isInitialLoad) {
        const newlyLiked = roomState.messages.some(
          m => m.lang === myRole && m.liked && !prevLikedMine.has(m.ts)
        );
        if (newlyLiked) spawnGlobalHearts(4);
      }

      loadedMsgSyncTs = targetSyncTs;
      if (lastOverlayMsgTs === 0) {
        lastOverlayMsgTs = getLatestMessageTs();
      }
      renderMessages(true);
      if (myRole === "ko") {
        translatePendingIncomingMessages();
      }
    } catch {
    } finally {
      isFetchingMsgs = false;
    }
  }

  async function pollRoom() {
    if (!roomPass || isPollingNow) return;
    if (document.hidden && callState === "idle") return;

    isPollingNow = true;
    try {
      const res = await fetch(`${getRoomBaseUrl()}.json`);
      if (res.ok) {
        const data = await res.json();
        if (data) {
          const serverVer = Number(data.appVersion || 0);
          if (serverVer < APP_VERSION) {
            patchRoom({ appVersion: APP_VERSION });
          } else if (serverVer > APP_VERSION && !isRecording && !isProcessing && callState === "idle") {
            if (sessionStorage.getItem("wt_reloaded_ver") !== String(serverVer)) {
              sessionStorage.setItem("wt_reloaded_ver", String(serverVer));
              window.location.replace(`${window.location.pathname}?v=${serverVer}`);
              return;
            }
          }

          roomState.lockedBy = data.lockedBy || "";
          roomState.lockedAt = data.lockedAt || 0;
          roomState.reservedBy = data.reservedBy || "";
          roomState.turnFor = data.turnFor || "";
          roomState.turnAt = data.turnAt || 0;
          roomState.presence = data.presence || {};
          roomState.typing = data.typing || {};
          roomState.diagnostics = data.diagnostics || {};
          roomState.callMeta = data.callMeta || null;

          handleIncomingEmojiBurst(data.emojiBurst);
          handleIncomingDoodleBurst(data.doodleBurst);

          const serverMsgSyncTs = Number(data.lastMsgTs || 0);
          if (pendingSaveCount === 0 && (loadedMsgSyncTs === -1 || serverMsgSyncTs !== loadedMsgSyncTs)) {
            fetchMessagesFromDb(data.messages, serverMsgSyncTs);
          }

          const now = Date.now();
          const partnerOnline = isPartnerOnline();

          if (callState === "test" && partnerOnline) {
            cleanupVideoCall(false);
          }

          if (roomState.lockedBy && roomState.lockedBy !== myRole) {
            const lockTimedOut = roomState.lockedAt && (now - roomState.lockedAt > 60000);
            if (!partnerOnline || lockTimedOut) {
              roomState.lockedBy = "";
              roomState.lockedAt = 0;
              patchRoom({ lockedBy: "", lockedAt: 0 });
            }
          }

          if (roomState.turnFor && roomState.turnAt && (now - roomState.turnAt > 15000)) {
            roomState.turnFor = "";
            roomState.turnAt = 0;
            patchRoom({ turnFor: "", turnAt: 0 });
          }

          isLockedByOther = Boolean(roomState.lockedBy && roomState.lockedBy !== myRole);
          isReservedByMe = (roomState.reservedBy === myRole);
          isMyTurn = (!isLockedByOther && roomState.turnFor === myRole);
          isPartnerTurn = (!isLockedByOther && Boolean(roomState.turnFor) && roomState.turnFor !== myRole);

          if (isMyTurn && roomState.turnAt !== lastTurnNotifiedAt) {
            lastTurnNotifiedAt = roomState.turnAt;
            if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
          }

          handleCallMetaSync(roomState.callMeta, partnerOnline);
          updateButtonUI();
        }
        updatePartnerStatusUI();
      }
    } catch {
      statusEl.textContent = t().reconnecting;
      statusEl.style.color = "#e53935";
    } finally {
      isPollingNow = false;
      scheduleNextPoll();
    }
  }

  /* ================= 영상통화 (WebRTC) 로직 ================= */

  function startCallTimer() {
    if (callConnectedAt > 0) return;
    callConnectedAt = Date.now();
    callTimerBadge.textContent = "00:00";
    callTimerBadge.classList.remove("hidden");
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
      if (!callConnectedAt) return;
      const sec = Math.floor((Date.now() - callConnectedAt) / 1000);
      callTimerBadge.textContent = formatDuration(sec, true);
    }, 500);
  }

  function stopCallTimer() {
    if (callTimerInterval) {
      clearInterval(callTimerInterval);
      callTimerInterval = null;
    }
    callConnectedAt = 0;
    callTimerBadge.classList.add("hidden");
    callTimerBadge.textContent = "00:00";
  }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
      }
    } catch {}
  }

  function releaseWakeLock() {
    if (wakeLockSentinel) {
      wakeLockSentinel.release().catch(() => {});
      wakeLockSentinel = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (callState === "active" || callState === "test" || callState === "outgoing") {
        requestWakeLock();
      }
      if (roomPass) {
        sendHeartbeat();
        pollRoom();
      }
    } else if (callState === "idle") {
      stopPolling();
    }
  });

  async function acquireVideoStream(facingMode = "user") {
    return await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 640, max: 640 },
        height: { ideal: 480, max: 480 },
        frameRate: { ideal: 24, max: 24 }
      },
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });
  }

  function applyVideoLayout() {
    const inCall = (callState === "active" || callState === "test" || callState === "outgoing");
    if (inCall) {
      document.body.classList.add("in-video-call");
      videoSection.classList.remove("hidden");
      if (isVideoFull) {
        document.body.classList.add("video-fullscreen");
        document.body.classList.toggle("video-menu-open", isVideoMenuOpen);
        videoSection.classList.remove("split");
        document.getElementById("chatArea").classList.add("hidden");
      } else {
        document.body.classList.remove("video-fullscreen", "video-menu-open");
        videoSection.classList.add("split");
        document.getElementById("chatArea").classList.remove("hidden");
        hideVideoSubtitle();
        scrollToBottom(false);
      }
      requestAnimationFrame(resizeDoodleCanvas);
    } else {
      document.body.classList.remove("in-video-call", "video-fullscreen", "video-menu-open");
      videoSection.classList.add("hidden");
      videoSection.classList.remove("split");
      document.getElementById("chatArea").classList.remove("hidden");
      hideVideoSubtitle();
    }
    remoteVideo.classList.toggle("fit-contain", isVideoContain);
    updateVideoControlButtons();
  }

  async function startSoloVideoTest() {
    closeSettingsMenu(false);
    callState = "test";
    isStartingCall = true;
    currentFacingMode = "user";
    isMuted = false;
    isRemoteMuted = false;
    isCamOff = false;
    isVideoFull = true;
    isVideoMenuOpen = false;
    isVideoContain = false;
    lastOverlayMsgTs = getLatestMessageTs();

    localVideoWrap.classList.add("hidden");
    remoteStatusBadge.textContent = t().camStarting;
    remoteStatusBadge.classList.remove("top-badge", "test-badge");
    remoteStatusBadge.classList.remove("hidden");
    applyVideoLayout();
    updatePartnerStatusUI();
    requestWakeLock();

    try {
      const stream = await acquireVideoStream(currentFacingMode);
      if (callState !== "test") {
        isStartingCall = false;
        stream.getTracks().forEach(tr => tr.stop());
        return;
      }
      localStream = stream;
      localVideo.srcObject = localStream;
      localVideo.classList.add("mirrored");
      localVideoWrap.classList.remove("hidden");
      remoteVideo.srcObject = localStream;
      remoteVideo.muted = true;
      remoteVideo.classList.add("mirrored");

      remoteStatusBadge.textContent = t().callTestBadge;
      remoteStatusBadge.classList.remove("top-badge");
      remoteStatusBadge.classList.add("test-badge");
      remoteStatusBadge.classList.remove("hidden");
      isStartingCall = false;
      startCallTimer();
    } catch {
      isStartingCall = false;
      cleanupVideoCall(false);
      alert(t().camDenied);
    }
  }

  async function requestVideoCall() {
    if (callState !== "idle" || isStartingCall) return;
    closeSettingsMenu(false);
    if (inAppName) alert(t().inAppVideoAlert);
    if (!isPartnerOnline()) {
      if (systemRole === "ko") {
        await startSoloVideoTest();
      } else {
        alert(t().callPartnerOffline);
      }
      return;
    }

    activeCallId = Date.now();
    isCaller = true;
    callState = "outgoing";
    isStartingCall = true;
    currentFacingMode = "user";
    isMuted = false;
    isRemoteMuted = false;
    isCamOff = false;
    isVideoFull = true;
    isVideoMenuOpen = false;
    isVideoContain = false;
    lastOverlayMsgTs = getLatestMessageTs();

    localVideoWrap.classList.add("hidden");
    showPipBtn.classList.add("hidden");
    remoteStatusBadge.textContent = t().camStarting;
    remoteStatusBadge.classList.remove("test-badge", "top-badge");
    remoteStatusBadge.classList.remove("hidden");
    applyVideoLayout();
    updatePartnerStatusUI();
    requestWakeLock();

    try {
      const stream = await acquireVideoStream(currentFacingMode);
      if (callState !== "outgoing") {
        isStartingCall = false;
        stream.getTracks().forEach(tr => tr.stop());
        return;
      }
      localStream = stream;
      localVideo.srcObject = localStream;
      localVideo.classList.add("mirrored");

      remoteVideo.srcObject = localStream;
      remoteVideo.muted = true;
      remoteVideo.classList.add("mirrored");

      remoteStatusBadge.textContent = t().callOutgoing;
      remoteStatusBadge.classList.add("top-badge");

      await fetch(`${getCallSignalUrl(activeCallId)}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ createdAt: activeCallId })
      });

      await patchRoom({
        callMeta: {
          status: "ringing",
          caller: myRole,
          callId: activeCallId
        }
      });
      isStartingCall = false;
    } catch (err) {
      isStartingCall = false;
      cleanupVideoCall(false);
      alert(t().camDenied);
    }
  }

  async function acceptVideoCall() {
    if (callState !== "incoming" || !activeCallId || isStartingCall) return;
    closeSettingsMenu(false);
    if (inAppName) alert(t().inAppVideoAlert);

    const targetCallId = activeCallId;
    isCaller = false;
    callState = "active";
    isStartingCall = true;
    currentFacingMode = "user";
    isMuted = false;
    isRemoteMuted = false;
    isCamOff = false;
    isVideoFull = true;
    isVideoMenuOpen = false;
    isVideoContain = false;

    callModal.classList.add("hidden");
    localVideoWrap.classList.add("hidden");
    remoteStatusBadge.textContent = t().camStarting;
    remoteStatusBadge.classList.remove("test-badge", "top-badge");
    remoteStatusBadge.classList.remove("hidden");
    applyVideoLayout();
    requestWakeLock();

    try {
      const stream = await acquireVideoStream(currentFacingMode);
      if (callState !== "active" || activeCallId !== targetCallId) {
        isStartingCall = false;
        stream.getTracks().forEach(tr => tr.stop());
        return;
      }
      localStream = stream;
      localVideo.srcObject = localStream;
      localVideo.classList.add("mirrored");

      showVideoUI(false);
      await initPeerConnection();
      await patchRoom({ "callMeta/status": "active" });
      isStartingCall = false;
      startSignalPolling();
    } catch (err) {
      isStartingCall = false;
      await patchRoom({ "callMeta/status": "idle" });
      cleanupVideoCall(false);
      alert(t().camDenied);

  async function rejectVideoCall() {
    await patchRoom({ "callMeta/status": "idle" });
    cleanupVideoCall(false);
  }

  async function endVideoCall() {
    if (document.activeElement) document.activeElement.blur();
    if (callState === "test") {
      cleanupVideoCall(false);
      return;
    }
    const endedCallId = activeCallId;
    const durSec = callConnectedAt > 0 ? Math.max(1, Math.floor((Date.now() - callConnectedAt) / 1000)) : 0;
    await patchRoom({ "callMeta/status": "idle" });
    cleanupVideoCall(false);
    if (durSec > 0) {
      await appendCallLogMessage(endedCallId, durSec, false);
    }
  }

  function handleCallMetaSync(meta, partnerOnline) {
    if (callState === "test") return;

    if (!meta || meta.status === "idle") {
      if (callState !== "idle" && !isStartingCall) {
        const endedCallId = activeCallId;
        const durSec = (callState === "active" && callConnectedAt > 0)
          ? Math.max(1, Math.floor((Date.now() - callConnectedAt) / 1000))
          : 0;
        cleanupVideoCall(false);
        if (durSec > 0 && endedCallId) {
          setTimeout(() => appendCallLogMessage(endedCallId, durSec, true), 1200);
        }
      }
      return;
    }

    if (meta.status === "ringing" && meta.caller === myRole) {
      if (callState === "outgoing" && !isStartingCall) {
        const timedOut = (Date.now() - (activeCallId || meta.callId || 0)) >= 45000;
        if (!partnerOnline || timedOut) {
          cleanupVideoCall(true);
        }
      }
      return;
    }

    if (meta.status === "ringing" && meta.caller !== myRole) {
      const expired = (Date.now() - (meta.callId || 0)) >= 45000;
      if (callState === "incoming") {
        if (!partnerOnline || expired) {
          cleanupVideoCall(true);
        }
      } else if (callState === "idle" && partnerOnline && !expired) {
        activeCallId = meta.callId;
        callState = "incoming";
        callModalTitle.textContent = t().callIncoming;
        callModal.classList.remove("hidden");
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      }
      return;
    }

    if (meta.status === "active" && callState === "outgoing" && meta.callId === activeCallId) {
      callState = "active";
      isVideoMenuOpen = false;
      showVideoUI(true);
      startCallerWebRTC();
      return;
    }
  }

  function showVideoUI(keepCurrentLayout = false) {
    remoteVideo.srcObject = null;
    remoteVideo.muted = isRemoteMuted;
    remoteVideo.classList.remove("mirrored");

    localVideoWrap.classList.remove("hidden");
    showPipBtn.classList.add("hidden");

    remoteStatusBadge.classList.remove("test-badge", "top-badge");
    remoteStatusBadge.textContent = t().callConnecting;
    remoteStatusBadge.classList.remove("hidden");

    if (!keepCurrentLayout) isVideoFull = true;
    lastOverlayMsgTs = getLatestMessageTs();
    applyVideoLayout();
    requestWakeLock();
  }

  async function startCallerWebRTC() {
    await initPeerConnection();
    startSignalPolling();
    await sendOffer(false);
  }

  function stopMediaWatchdog() {
    if (mediaWatchdogTimer) {
      clearInterval(mediaWatchdogTimer);
      mediaWatchdogTimer = null;
    }
    lastInboundVideoBytes = -1;
    lastInboundAudioBytes = -1;
    lastInboundFrames = -1;
    freezeStreakSec = 0;
  }

  function triggerAutoReconnect(reason = "") {
    if (callState !== "active" || !pc || !activeCallId) return;
    const now = Date.now();
    if (now - lastReconnectAttemptAt < 4500) return;
    lastReconnectAttemptAt = now;

    remoteStatusBadge.classList.remove("test-badge", "top-badge");
    remoteStatusBadge.textContent = reason ? `${t().callReconnecting} (${reason})` : t().callReconnecting;
    remoteStatusBadge.classList.remove("hidden");

    if (isCaller) {
      sendOffer(true);
    } else {
      fetch(`${getCallSignalUrl(activeCallId)}/reconnectReq.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ts: now, by: myRole })
      }).catch(() => {});
    }
  }

  function startMediaWatchdog() {
    if (mediaWatchdogTimer) return;
    lastInboundVideoBytes = -1;
    lastInboundAudioBytes = -1;
    lastInboundFrames = -1;
    freezeStreakSec = 0;

    mediaWatchdogTimer = setInterval(async () => {
      if (callState !== "active" || !pc) {
        stopMediaWatchdog();
        return;
      }

      if (remoteVideo.srcObject && remoteVideo.paused) {
        remoteVideo.play().catch(() => {});
      }

      try {
        const stats = await pc.getStats();
        let vBytes = -1;
        let vFrames = -1;
        let aBytes = -1;

        stats.forEach(report => {
          if (report.type === "inbound-rtp") {
            const kind = report.kind || report.mediaType;
            if (kind === "video") {
              if (typeof report.bytesReceived === "number") vBytes = report.bytesReceived;
              if (typeof report.framesDecoded === "number") vFrames = report.framesDecoded;
            } else if (kind === "audio") {
              if (typeof report.bytesReceived === "number") aBytes = report.bytesReceived;
            }
          }
        });

        const hasBaseline = (lastInboundVideoBytes >= 0 || lastInboundAudioBytes >= 0 || lastInboundFrames >= 0);
        if (!hasBaseline) {
          if (vBytes > 0 || aBytes > 0 || vFrames > 0) {
            lastInboundVideoBytes = vBytes;
            lastInboundAudioBytes = aBytes;
            lastInboundFrames = vFrames;
            freezeStreakSec = 0;
          }
          return;
        }

        const videoMoved = (vBytes > lastInboundVideoBytes) || (vFrames > lastInboundFrames);
        const audioMoved = (aBytes > lastInboundAudioBytes);

        if (vBytes >= 0) lastInboundVideoBytes = vBytes;
        if (aBytes >= 0) lastInboundAudioBytes = aBytes;
        if (vFrames >= 0) lastInboundFrames = vFrames;

        if (videoMoved || audioMoved) {
          freezeStreakSec = 0;
          const st = pc.iceConnectionState;
          if (st === "connected" || st === "completed") {
            remoteStatusBadge.classList.add("hidden");
          }
        } else {
          freezeStreakSec++;
          if (freezeStreakSec >= 3) {
            triggerAutoReconnect("freeze");
          }
        }
      } catch {}
    }, 1000);
  }

  async function initPeerConnection() {
    if (pc) {
      pc.close();
      pc = null;
    }
    stopMediaWatchdog();
    processedIceKeys.clear();
    lastOfferTs = 0;
    lastAnswerTs = 0;
    lastReconnectAttemptAt = 0;
    lastHandledReconnectReqTs = Date.now();

    pc = new RTCPeerConnection(ICE_CONFIG);

    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });

    applyVideoBitrateLimit();

    pc.ontrack = (event) => {
      if (event.streams && event.streams[0]) {
        remoteVideo.srcObject = event.streams[0];
        remoteVideo.muted = isRemoteMuted;
        remoteVideo.play().catch(() => {});
        remoteStatusBadge.classList.add("hidden");
        startCallTimer();
        startMediaWatchdog();
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && activeCallId) {
        fetch(`${getCallSignalUrl(activeCallId)}/ice_${myRole}.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(event.candidate.toJSON())
        }).catch(() => {});
      }
    };

    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      const st = pc.iceConnectionState;
      if (st === "connected" || st === "completed") {
        remoteStatusBadge.classList.add("hidden");
        freezeStreakSec = 0;
        startCallTimer();
        startMediaWatchdog();
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      } else if (st === "checking" || st === "new") {
        remoteStatusBadge.classList.remove("test-badge", "top-badge");
        remoteStatusBadge.textContent = `${t().callConnecting} (${st})`;
        remoteStatusBadge.classList.remove("hidden");
      } else if (st === "failed") {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        triggerAutoReconnect("failed");
      } else if (st === "disconnected") {
        remoteStatusBadge.classList.remove("test-badge", "top-badge");
        remoteStatusBadge.textContent = `${t().callReconnecting} (${st})`;
        remoteStatusBadge.classList.remove("hidden");
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            if (pc && callState === "active" && (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed")) {
              triggerAutoReconnect("disconnected");
            }
          }, 1000);
        }
      }
    };
  }

  async function applyVideoBitrateLimit() {
    if (!pc) return;
    try {
      const videoSender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (!videoSender) return;
      const params = videoSender.getParameters();
      if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
      params.encodings[0].maxBitrate = 500000;
      params.degradationPreference = "maintain-framerate";
      await videoSender.setParameters(params);
    } catch {}
  }

  async function sendOffer(iceRestart = false) {
    if (!pc || !activeCallId) return;
    try {
      const offer = await pc.createOffer(iceRestart ? { iceRestart: true } : {});
      await pc.setLocalDescription(offer);
      const ts = Date.now();
      lastOfferTs = ts;
      await fetch(`${getCallSignalUrl(activeCallId)}/offer.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: offer.type, sdp: offer.sdp, ts })
      });
    } catch {}
  }

  function startSignalPolling() {
    if (signalPollTimer) clearInterval(signalPollTimer);
    pollSignaling();
    signalPollTimer = setInterval(pollSignaling, 500);
  }

  async function pollSignaling() {
    if (callState !== "active" || !activeCallId || !pc) return;
    try {
      const res = await fetch(`${getCallSignalUrl(activeCallId)}.json`);
      if (!res.ok) return;
      const data = await res.json();
      if (!data) return;

      if (!isCaller && data.offer && data.offer.ts > lastOfferTs) {
        lastOfferTs = data.offer.ts;
        await pc.setRemoteDescription(new RTCSessionDescription({
          type: data.offer.type,
          sdp: data.offer.sdp
        }));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await fetch(`${getCallSignalUrl(activeCallId)}/answer.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: answer.type, sdp: answer.sdp, ts: Date.now() })
        });
      }

      if (isCaller && data.reconnectReq && data.reconnectReq.ts > lastHandledReconnectReqTs) {
        lastHandledReconnectReqTs = data.reconnectReq.ts;
        if (Date.now() - lastOfferTs > 3000) {
          lastReconnectAttemptAt = Date.now();
          await sendOffer(true);
        }
      }

      if (isCaller && data.answer && data.answer.ts > lastAnswerTs) {
        lastAnswerTs = data.answer.ts;
        if (pc.signalingState === "have-local-offer") {
          await pc.setRemoteDescription(new RTCSessionDescription({
            type: data.answer.type,
            sdp: data.answer.sdp
          }));
        }
      }

      const otherIce = data[`ice_${getOtherRole()}`];
      if (otherIce && pc.remoteDescription) {
        for (const [key, cand] of Object.entries(otherIce)) {
          if (processedIceKeys.has(key)) continue;
          processedIceKeys.add(key);
          try {
            await pc.addIceCandidate(new RTCIceCandidate(cand));
          } catch {}
        }
      }
    } catch {}
  }

  function cleanupVideoCall(resetRemote = false) {
    if (document.activeElement) document.activeElement.blur();
    if (signalPollTimer) { clearInterval(signalPollTimer); signalPollTimer = null; }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    stopMediaWatchdog();
    if (doodleRaf) { cancelAnimationFrame(doodleRaf); doodleRaf = null; }
    activeDoodles = [];
    currentDoodleStroke = null;
    const dCtx = doodleCanvas.getContext("2d");
    if (dCtx) dCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);

    stopCallTimer();
    hideVideoSubtitle();
    releaseWakeLock();

    if (pc) {
      pc.onicecandidate = null;
      pc.ontrack = null;
      pc.oniceconnectionstatechange = null;
      pc.close();
      pc = null;
    }

    if (localStream) {
      localStream.getTracks().forEach(tr => tr.stop());
      localStream = null;
    }

    remoteVideo.srcObject = null;
    remoteVideo.muted = false;
    remoteVideo.classList.remove("mirrored", "fit-contain");
    localVideo.srcObject = null;
    callModal.classList.add("hidden");
    remoteStatusBadge.classList.add("hidden");
    remoteStatusBadge.classList.remove("test-badge", "top-badge");

    isStartingCall = false;
    callState = "idle";
    activeCallId = 0;
    isCaller = false;
    isMuted = false;
    isRemoteMuted = false;
    isCamOff = false;
    isVideoFull = true;
    isVideoMenuOpen = false;
    isVideoContain = false;
    pipPosIndex = 0;
    localVideoWrap.className = "pos-br";
    localVideoWrap.classList.remove("hidden");
    showPipBtn.classList.add("hidden");
    localCamOffMask.classList.add("hidden");

    applyVideoLayout();
    if (resetRemote) patchRoom({ "callMeta/status": "idle" });
    updatePartnerStatusUI();
    flushPendingCallAudios();

  async function switchCamera() {
    if ((callState !== "active" && callState !== "test" && callState !== "outgoing") || !localStream) return;
    const prevFacing = currentFacingMode;
    const nextFacing = currentFacingMode === "user" ? "environment" : "user";

    const oldVideoTrack = localStream.getVideoTracks()[0];
    if (oldVideoTrack) {
      oldVideoTrack.stop();
      localStream.removeTrack(oldVideoTrack);
    }

    const requestCam = async (mode) => {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: mode },
            width: { ideal: 640, max: 640 },
            height: { ideal: 480, max: 480 },
            frameRate: { ideal: 24, max: 24 }
          }
        });
      } catch {
        return await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: mode },
            width: { ideal: 640, max: 640 },
            height: { ideal: 480, max: 480 }
          }
        });
      }
    };

    try {
      let tempStream;
      try {
        tempStream = await requestCam(nextFacing);
        currentFacingMode = nextFacing;
      } catch {
        tempStream = await requestCam(prevFacing);
        currentFacingMode = prevFacing;
      }

      const newVideoTrack = tempStream.getVideoTracks()[0];
      newVideoTrack.enabled = !isCamOff;
      localStream.addTrack(newVideoTrack);

      if (pc) {
        const videoSender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (videoSender) await videoSender.replaceTrack(newVideoTrack);
        applyVideoBitrateLimit();
      }

      localVideo.srcObject = null;
      localVideo.srcObject = localStream;
      localVideo.classList.toggle("mirrored", currentFacingMode === "user");
      if (callState === "test" || callState === "outgoing") {
        remoteVideo.srcObject = null;
        remoteVideo.srcObject = localStream;
        remoteVideo.classList.toggle("mirrored", currentFacingMode === "user");
      }
    } catch {}
  }

  /* ================= Groq Whisper STT & Gemini API 2모델 자동 순위 조절 ================= */

  const MODEL_LIST = [MODEL_35_LITE, MODEL_31_LITE];
  const MODEL_STATS_KEY = "wt_model_stats_v2";

  function getGroqKey() {
    if (!apiKey) return "";
    return GROQ_ENC_BYTES.map((b, i) =>
      String.fromCharCode(b ^ GROQ_MASK.charCodeAt(i % GROQ_MASK.length))
    ).join("");
  }

  function createEmptyGroqStats() {
    return { ok: 0, fail: 0, streakFail: 0, avgMs: 0, lastOkAt: 0, lastFailAt: 0, lastTriedAt: 0, lastErr: "", cooldownUntil: 0 };
  }

  function createEmptyModelStats() {
    const models = {};
    MODEL_LIST.forEach(m => {
      models[m] = { ok: 0, fail: 0, streakFail: 0, avgMs: 0, lastOkAt: 0, lastFailAt: 0, lastTriedAt: 0, lastErr: "" };
    });
    return {
      totalCalls: 0,
      lastUsedModel: "",
      lastUsedAt: 0,
      lastLatencyMs: 0,
      groq: createEmptyGroqStats(),
      groqTranslate: createEmptyGroqStats(),
      models
    };
  }

  function loadModelStats() {
    const base = createEmptyModelStats();
    try {
      const raw = JSON.parse(localStorage.getItem(MODEL_STATS_KEY) || "null");
      if (raw && typeof raw === "object") {
        base.totalCalls = Number(raw.totalCalls || 0);
        base.lastUsedModel = raw.lastUsedModel || "";
        base.lastUsedAt = Number(raw.lastUsedAt || 0);
        base.lastLatencyMs = Number(raw.lastLatencyMs || 0);
        if (raw.groq && typeof raw.groq === "object") {
          base.groq = { ...base.groq, ...raw.groq };
        }
        if (raw.groqTranslate && typeof raw.groqTranslate === "object") {
          base.groqTranslate = { ...base.groqTranslate, ...raw.groqTranslate };
        }
        MODEL_LIST.forEach(m => {
          if (raw.models && raw.models[m]) {
            base.models[m] = { ...base.models[m], ...raw.models[m] };
          }
        });
      }
    } catch {}
    return base;
  }

  let modelStats = loadModelStats();

  function saveModelStats() {
    try {
      localStorage.setItem(MODEL_STATS_KEY, JSON.stringify(modelStats));
    } catch {}
  }

  function isGroqInCooldown() {
    const until = Number(modelStats.groq?.cooldownUntil || 0);
    return until > Date.now();
  }

  function recordGroqResult(success, latencyMs, errLabel = "", forceCooldown = false) {
    if (!modelStats.groq) modelStats.groq = createEmptyGroqStats();
    const st = modelStats.groq;
    const now = Date.now();
    st.lastTriedAt = now;
    if (success) {
      st.ok = (st.ok || 0) + 1;
      st.streakFail = 0;
      st.lastOkAt = now;
      st.lastErr = "";
      st.cooldownUntil = 0;
      st.avgMs = st.avgMs > 0 ? Math.round(st.avgMs * 0.7 + latencyMs * 0.3) : Math.round(latencyMs);
    } else {
      st.fail = (st.fail || 0) + 1;
      st.streakFail = (st.streakFail || 0) + 1;
      st.lastFailAt = now;
      st.lastErr = errLabel || "error";
      if (forceCooldown || st.streakFail >= 3) {
        st.cooldownUntil = now + GROQ_COOLDOWN_MS;
      }
    }
    saveModelStats();
  }

  function cleanWhisperText(rawText) {
    const txt = (rawText || "").trim();
    if (!txt) return "";
    if (/^[\s.,!?~…·\-_"'()\[\]]+$/.test(txt)) return "";
    const lower = txt.toLowerCase().replace(/[.,!?~…\s]+$/g, "");
    const hallucinations = [
      "mbc 뉴스", "kbs 뉴스", "sbs 뉴스", "시청해주셔서 감사합니다", "시청해 주셔서 감사합니다",
      "구독과 좋아요", "자막 제공", "영상 편집", "고맙습니다",
      "thank you", "thank you for watching", "thanks for watching", "subtitles by", "amara.org",
      "hãy đăng ký kênh", "cảm ơn các bạn đã xem", "cảm ơn các bạn đã theo dõi"
    ];
    if (hallucinations.includes(lower)) return "";
    return txt;
  }

  function normalizeGeminiAudioMime(rawMime) {
    const clean = String(rawMime || "audio/webm").split(";")[0].trim().toLowerCase();
    if (clean === "audio/mp4" || clean === "audio/x-m4a") {
      return "audio/m4a";
    }
    return clean;
  }

  function pickGroqFilename(cleanMime) {
    const m = (cleanMime || "").toLowerCase();
    if (m.includes("webm")) return "audio.webm";
    if (m.includes("ogg")) return "audio.ogg";
    if (m.includes("wav")) return "audio.wav";
    return "audio.m4a";
  }

  async function transcribeWithGroq(audioBlob, cleanMime, langCode) {
    const groqKey = getGroqKey();
    if (!groqKey || isGroqInCooldown()) {
      return { ok: false, skipped: true, text: "" };
    }

    const sttModel = langCode === "vi" ? GROQ_STT_MODEL_VI : GROQ_STT_MODEL;
    const sttTimeoutMs = langCode === "vi" ? 7500 : 6000;
    const formData = new FormData();
    formData.append("file", audioBlob, pickGroqFilename(cleanMime));
    formData.append("model", sttModel);
    formData.append("language", langCode);
    formData.append("response_format", "json");
    formData.append("temperature", "0");

    const t0 = Date.now();
    try {
      const res = await fetchWithTimeout("https://api.groq.com/openai/v1/audio/transcriptions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${groqKey}`
        },
        body: formData
      }, sttTimeoutMs);

      if (res.ok) {
        const json = await res.json();
        const cleaned = cleanWhisperText(json.text || "");
        recordGroqResult(true, Date.now() - t0);
        return { ok: true, skipped: false, text: cleaned };
      }

      const isRateOrAuth = (res.status === 429 || res.status === 401 || res.status === 403);
      recordGroqResult(false, Date.now() - t0, `HTTP ${res.status}`, isRateOrAuth);
      return { ok: false, skipped: false, text: "" };
    } catch (err) {
      const errTag = (err && err.name === "AbortError") ? "timeout" : "network";
      recordGroqResult(false, Date.now() - t0, errTag, false);
      return { ok: false, skipped: false, text: "" };
    }
  }

  function isGroqTranslateInCooldown() {
    const until = Number(modelStats.groqTranslate?.cooldownUntil || 0);
    return until > Date.now();
  }

  function recordGroqTranslateResult(success, latencyMs, errLabel = "", forceCooldown = false) {
    if (!modelStats.groqTranslate) modelStats.groqTranslate = createEmptyGroqStats();
    const st = modelStats.groqTranslate;
    const now = Date.now();
    st.lastTriedAt = now;
    if (success) {
      st.ok = (st.ok || 0) + 1;
      st.streakFail = 0;
      st.lastOkAt = now;
      st.lastErr = "";
      st.cooldownUntil = 0;
      st.avgMs = st.avgMs > 0 ? Math.round(st.avgMs * 0.7 + latencyMs * 0.3) : Math.round(latencyMs);
      modelStats.lastUsedModel = GROQ_TRANSLATE_MODEL;
      modelStats.lastUsedAt = now;
      modelStats.lastLatencyMs = Math.round(latencyMs);
    } else {
      st.fail = (st.fail || 0) + 1;
      st.streakFail = (st.streakFail || 0) + 1;
      st.lastFailAt = now;
      st.lastErr = errLabel || "error";
      if (forceCooldown || st.streakFail >= 3) {
        st.cooldownUntil = now + GROQ_COOLDOWN_MS;
      }
    }
    saveModelStats();
  }

  async function translateWithGroq(systemInstruction, userPrompt, timeoutMs = GROQ_TRANSLATE_TIMEOUT_MS) {
    const groqKey = getGroqKey();
    if (!groqKey || isGroqTranslateInCooldown()) {
      throw new Error("Groq translate unavailable");
    }

    const t0 = Date.now();
    try {
      const res = await fetchWithTimeout("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${groqKey}`
        },
        body: JSON.stringify({
          model: GROQ_TRANSLATE_MODEL,
          temperature: 0.2,
          max_tokens: 280,
          messages: [
            { role: "system", content: systemInstruction },
            { role: "user", content: userPrompt }
          ]
        })
      }, timeoutMs);

      if (res.ok) {
        const json = await res.json();
        let out = (json.choices?.[0]?.message?.content || "").trim();
        out = out.replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
        out = out.replace(/^["'`]+|["'`]+$/g, "").trim();
        if (!out) {
          recordGroqTranslateResult(false, Date.now() - t0, "empty", false);
          throw new Error("Groq translate empty");
        }
        recordGroqTranslateResult(true, Date.now() - t0);
        return out;
      }

      const isHardErr = (res.status === 429 || res.status === 401 || res.status === 403 || res.status === 404);
      recordGroqTranslateResult(false, Date.now() - t0, `HTTP ${res.status}`, isHardErr);
      throw new Error(`Groq translate HTTP ${res.status}`);
    } catch (err) {
      if (!(err && err.message && err.message.startsWith("Groq translate"))) {
        const errTag = (err && err.name === "AbortError") ? "timeout" : "network";
        recordGroqTranslateResult(false, Date.now() - t0, errTag, false);
      }
      throw err;
    }
  }

  function computeModelScore(model, defaultIdx) {
    const st = modelStats.models[model] || {};
    const ok = Number(st.ok || 0);
    const fail = Number(st.fail || 0);
    const streakFail = Number(st.streakFail || 0);
    const avgMs = Number(st.avgMs || 0);
    const total = ok + fail;

    let score = 60 - defaultIdx * 2;
    if (total > 0) {
      const smoothRate = (ok + 1) / (total + 2);
      score = smoothRate * 100 - defaultIdx * 1.5;
      if (avgMs > 0) {
        score -= Math.min(35, avgMs / 250);
      }
    }

    if (streakFail > 0) {
      const minsSinceFail = st.lastFailAt ? (Date.now() - st.lastFailAt) / 60000 : 0;
      const decay = Math.max(0.15, 1 - minsSinceFail / 10);
      score -= streakFail * 35 * decay;
    }
    return score;
  }

  function getRankedModels(allowExplore = false) {
    const scored = MODEL_LIST.map((model, idx) => ({
      model,
      score: computeModelScore(model, idx)
    }));
    scored.sort((a, b) => b.score - a.score);
    const ranked = scored.map(x => x.model);

    if (allowExplore && ranked.length > 1 && modelStats.totalCalls > 0 && modelStats.totalCalls % 10 === 0) {
      const now = Date.now();
      const probeCandidate = ranked.slice(1).find(m => {
        const lastTried = modelStats.models[m]?.lastTriedAt || 0;
        return (now - lastTried) > 180000;
      });
      if (probeCandidate) {
        return [probeCandidate, ...ranked.filter(m => m !== probeCandidate)];
      }
    }
    return ranked;
  }

  function recordModelResult(model, success, latencyMs, errLabel = "") {
    if (!modelStats.models[model]) return;
    const st = modelStats.models[model];
    const now = Date.now();
    st.lastTriedAt = now;
    if (success) {
      st.ok = (st.ok || 0) + 1;
      st.streakFail = 0;
      st.lastOkAt = now;
      st.lastErr = "";
      st.avgMs = st.avgMs > 0 ? Math.round(st.avgMs * 0.7 + latencyMs * 0.3) : Math.round(latencyMs);
      modelStats.lastUsedModel = model;
      modelStats.lastUsedAt = now;
      modelStats.lastLatencyMs = Math.round(latencyMs);
    } else {
      st.fail = (st.fail || 0) + 1;
      st.streakFail = (st.streakFail || 0) + 1;
      st.lastFailAt = now;
      st.lastErr = errLabel || "error";
    }
    saveModelStats();
  }

  function sleepMs(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function callGeminiWithFallback(bodyObj, opts = {}) {
    const baseTimeout = opts.baseTimeoutMs || 4500;
    const fallbackTimeout = opts.fallbackTimeoutMs || 5500;
    const onRetry = typeof opts.onRetry === "function" ? opts.onRetry : null;

    modelStats.totalCalls = (modelStats.totalCalls || 0) + 1;
    const ranked = getRankedModels(true);

    const fullPlan = ranked.map((model, idx) => ({
      model,
      timeout: idx === 0 ? baseTimeout : fallbackTimeout,
      delayBefore: idx === 0 ? 0 : 150
    }));

    let lastErr = null;
    for (let i = 0; i < fullPlan.length; i++) {
      const { model, timeout, delayBefore } = fullPlan[i];
      if (i > 0 && onRetry) {
        onRetry(i, model);
      }
      if (delayBefore > 0) {
        await sleepMs(delayBefore);
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const t0 = Date.now();
      try {
        const res = await fetchWithTimeout(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyObj)
        }, timeout);

        if (res.ok) {
          const json = await res.json();
          recordModelResult(model, true, Date.now() - t0);
          return json;
        }

        const errText = await res.text();
        recordModelResult(model, false, Date.now() - t0, `HTTP ${res.status}`);
        lastErr = new Error(`Gemini (${model} / ${res.status}): ${errText}`);
        if (res.status === 401 || res.status === 403) {
          throw lastErr;
        }
      } catch (err) {
        const isAuthErr = err && err.message && /\/ (401|403)\)/.test(err.message);
        if (!isAuthErr) {
          const errTag = (err && err.name === "AbortError") ? "timeout" : "network";
          recordModelResult(model, false, Date.now() - t0, errTag);
        }
        lastErr = err;
        if (isAuthErr) {
          throw err;
        }
      }
    }
    throw lastErr || new Error("Translation failed");
  }

  async function translateWithFreeGoogle(text, sl, tl) {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetchWithTimeout(url, { method: "GET" }, 5000);
    if (!res.ok) throw new Error("Free translate failed");
    const data = await res.json();
    if (Array.isArray(data) && Array.isArray(data[0])) {
      return data[0].map(seg => seg[0] || "").join("").trim();
    }
    throw new Error("Free translate invalid response");
  }
