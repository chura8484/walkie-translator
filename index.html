  async function translateTextForLang(text, msgLang) {
    const sourceLang = msgLang === "ko" ? "한국어" : "베트남어";
    const targetLang = msgLang === "ko" ? "베트남어" : "한국어";
    const slCode = msgLang === "ko" ? "ko" : "vi";
    const tlCode = msgLang === "ko" ? "vi" : "ko";

    const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(msgLang)}
- 반드시 입력된 ${sourceLang} 문장을 자연스러운 구어체 ${targetLang}로만 번역해서 출력해. (절대 원문과 같은 언어로 출력하거나 설명을 덧붙이지 마)`;

    const contextText = buildContextReference();
    const userPrompt = `${contextText}[${sourceLang} → ${targetLang} 번역]\n${text}`;
    const contents = [
      {
        role: "user",
        parts: [
          { text: userPrompt }
        ]
      }
    ];

    try {
      const data = await callGeminiWithFallback({
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents,
        generationConfig: {
          temperature: 0.2,
          maxOutputTokens: 280
        }
      }, {
        baseTimeoutMs: 6000,
        fallbackTimeoutMs: 8000
      });

      const parts = data.candidates?.[0]?.content?.parts || [];
      for (const p of parts) {
        if (p.thought) continue;
        if (p.text && p.text.trim()) return p.text.trim();
      }
    } catch {}

    try {
      const groqOut = await translateWithGroq(systemInstruction, userPrompt);
      if (groqOut) return groqOut;
    } catch {}

    return await translateWithFreeGoogle(text, slCode, tlCode);
  }

  async function translateIncomingMessageByTs(msgTs, isManual = false) {
    if (!apiKey || !roomPass) return;
    if (translatingIncomingSet.has(msgTs)) return;
    const target = (roomState.messages || []).find(m => m.ts === msgTs);
    if (!target || !target.original || !target.untranslated) return;

    if (isManual) failedIncomingTranslateSet.delete(msgTs);
    translatingIncomingSet.add(msgTs);
    lastRenderSig = "";
    renderMessages(true);

    try {
      const translated = await translateTextForLang(target.original, target.lang || "vi");
      if (!translated) throw new Error("empty translation");

      const curIdx = (roomState.messages || []).findIndex(m => m.ts === msgTs);
      if (curIdx !== -1) {
        const updated = roomState.messages.map((m, i) =>
          i === curIdx ? { ...m, translated, untranslated: false } : m
        );
        roomState.messages = updated;
        translatingIncomingSet.delete(msgTs);
        failedIncomingTranslateSet.delete(msgTs);
        lastRenderSig = "";
        renderMessages(true);

        const latest = updated[updated.length - 1];
        if (latest && latest.ts === msgTs && (callState === "active" || callState === "test" || callState === "outgoing") && isVideoFull) {
          showVideoSubtitle(latest);
        }

        const syncTs = Date.now();
        loadedMsgSyncTs = syncTs;
        await saveMessagesToDb(updated, syncTs, { upsertMsg: updated[curIdx] });
      }
    } catch {
      translatingIncomingSet.delete(msgTs);
      failedIncomingTranslateSet.add(msgTs);
      lastRenderSig = "";
      renderMessages(true);
    }
  }

  async function translatePendingIncomingMessages() {
    if (myRole !== "ko" || !apiKey || !roomPass || isTranslatingIncomingQueue) return;
    const pending = (roomState.messages || []).filter(
      m => m.untranslated && m.lang !== myRole && m.original && !translatingIncomingSet.has(m.ts) && !failedIncomingTranslateSet.has(m.ts)
    );
    if (pending.length === 0) return;

    isTranslatingIncomingQueue = true;
    try {
      for (const m of pending) {
        if (myRole !== "ko" || !roomPass) break;
        await translateIncomingMessageByTs(m.ts, false);
      }
    } finally {
      isTranslatingIncomingQueue = false;
    }
  }

  function buildRenderSig() {
    const msgs = roomState.messages || [];
    const total = msgs.length;
    const startIdx = Math.max(0, total - visibleMsgCount);
    const visibleSlice = msgs.slice(startIdx);
    return `${startIdx}|${myRole}|${currentPlayingTs}|` + visibleSlice.map(m => {
      const vSt = videoJobStatusMap[m.ts];
      const vSig = vSt ? `${vSt.state}_${vSt.progress}` : "";
      return `${m.ts}:${m.type || ""}:${(m.hasAudio || m.audioData) ? 1 : 0}:${m.audioReady === false ? 0 : 1}:${m.audioDuration || audioDurationCache[m.ts] || 0}:${m.hasPhoto ? 1 : 0}:${m.hasVideo ? 1 : 0}:${m.videoReady ? 1 : 0}:${m.videoExpired ? 1 : 0}:${vSig}:${m.liked ? 1 : 0}:${m.untranslated ? 1 : 0}:${translatingIncomingSet.has(m.ts) ? 1 : 0}:${(m.original || "").length}:${(m.translated || "").length}`;
    }).join("|");
  }

  async function toggleMessageHeart(msgTs, btnEl) {
    const idx = roomState.messages.findIndex(m => m.ts === msgTs);
    if (idx === -1) return;

    const nextLiked = !roomState.messages[idx].liked;
    const updated = roomState.messages.map((m, i) =>
      i === idx ? { ...m, liked: nextLiked } : m
    );
    roomState.messages = updated;

    if (btnEl) {
      btnEl.classList.toggle("liked", nextLiked);
      btnEl.textContent = nextLiked ? "❤️" : "🤍";
    }
    lastRenderSig = buildRenderSig();

    if (nextLiked) spawnGlobalHearts(4);

    const syncTs = Date.now();
    loadedMsgSyncTs = syncTs;
    await saveMessagesToDb(updated, syncTs, { upsertMsg: updated[idx] });
  }

  async function deleteMyMessage(msgTs) {
    if (!confirm(t().deleteConfirm)) return;
    const target = roomState.messages.find(m => m.ts === msgTs);
    if (!target) return;

    if (currentPlayingTs === msgTs) stopCurrentAudio();
    if (target.hasAudio) {
      pendingCallAudios = pendingCallAudios.filter(a => a.ts !== msgTs);
      delete audioCache[msgTs];
      idbDelete("audios", msgTs);
      fetch(`${getAudioBaseUrl()}/${msgTs}.json`, { method: "DELETE" }).catch(() => {});
    }
    if (target.hasPhoto) {
      delete photoCache[msgTs];
      idbDelete("photos", msgTs);
      fetch(`${getPhotoBaseUrl()}/${msgTs}.json`, { method: "DELETE" }).catch(() => {});
    }
    if (target.hasVideo) {
      pendingVideoQueue = pendingVideoQueue.filter(q => q.ts !== msgTs);
      delete videoJobStatusMap[msgTs];
      delete videoCache[msgTs];
      idbDelete("videos", msgTs);
      idbDelete("video_queue", msgTs);
      fetch(`${getVideoBaseUrl()}/${msgTs}.json`, { method: "DELETE" }).catch(() => {});
    }

    const updated = roomState.messages.filter(m => m.ts !== msgTs);
    roomState.messages = updated;
    lastRenderSig = "";
    renderMessages(true);

    const syncTs = Date.now();
    loadedMsgSyncTs = syncTs;
    await saveMessagesToDb(updated, syncTs, { deletedTs: msgTs });
  }

  async function markAudioUnavailable(msgTs) {
    const idx = roomState.messages.findIndex(m => m.ts === msgTs);
    if (idx === -1) return;
    const updated = roomState.messages.map((m, i) => {
      if (i !== idx) return m;
      const { audioData, audioMime, ...rest } = m;
      return { ...rest, hasAudio: false };
    });
    roomState.messages = updated;
    lastRenderSig = "";
    renderMessages(true);

    const syncTs = Date.now();
    loadedMsgSyncTs = syncTs;
    await saveMessagesToDb(updated, syncTs, { upsertMsg: updated[idx] });
  }

  /* ================= 어색한 번역 다시 번역하기 ================= */

  async function loadAudioPayloadForMsg(msg) {
    if (!msg) return null;
    const ts = msg.ts;
    if (audioCache[ts] && audioCache[ts].data) return audioCache[ts];
    if (msg.audioData && msg.audioMime) {
      const payload = { data: msg.audioData, mime: msg.audioMime };
      audioCache[ts] = payload;
      return payload;
    }
    const fromIdb = await idbGet("audios", ts);
    if (fromIdb && fromIdb.data) {
      const payload = { data: fromIdb.data, mime: fromIdb.mime };
      audioCache[ts] = payload;
      return payload;
    }
    try {
      const res = await fetchWithTimeout(`${getAudioBaseUrl()}/${ts}.json`, { method: "GET" }, 7000);
      if (res.ok) {
        const obj = await res.json();
        if (obj && obj.data) {
          audioCache[ts] = obj;
          idbPut("audios", { ts, data: obj.data, mime: obj.mime });
          return obj;
        }
      }
    } catch {}
    return null;
  }

  function buildContextBeforeTs(msgTs) {
    const prevMsgs = (roomState.messages || [])
      .filter(m => m.ts < msgTs && !m.hasPhoto && m.type !== "call_log" && m.original)
      .slice(-MAX_CONTEXT_MSGS);
    if (prevMsgs.length === 0) return "";
    const lines = prevMsgs.map(m => `- (${m.lang === "ko" ? "한→베" : "베→한"}) ${m.original} / ${m.translated}`);
    return `[이전 대화 문맥 참고]\n${lines.join("\n")}\n\n`;
  }

  async function retranslateMessage(msgTs, btnEl) {
    if (isProcessing || !apiKey) return;
    const idx = roomState.messages.findIndex(m => m.ts === msgTs);
    if (idx === -1) return;
    const target = roomState.messages[idx];
    if (!target.original || target.lang !== myRole) return;

    const origBtnText = btnEl.textContent;
    btnEl.textContent = "⏳";
    btnEl.disabled = true;

    try {
      const msgLang = target.lang || myRole;
      const sourceLang = msgLang === "ko" ? "한국어" : "베트남어";
      const targetLang = msgLang === "ko" ? "베트남어" : "한국어";
      const contextText = buildContextBeforeTs(msgTs);

      let newOrig = target.original;
      let newTrans = "";

      // 음성 메시지인 경우: 저장된 원본 오디오를 꺼내 Gemini 직접 청취로 처음부터 다시 인식 및 번역
      const audioPayload = (target.hasAudio || target.audioData) ? await loadAudioPayloadForMsg(target) : null;
      if (audioPayload && audioPayload.data) {
        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(msgLang)}
- 이전 음성인식에 오류가 있어서 원본 오디오를 처음부터 다시 듣고 정확히 통역해야 해.
- 배경 잡음은 무시하고 화자의 ${sourceLang} 목소리만 정확하게 받아쓴 뒤, 의미를 왜곡하지 말고 자연스러운 구어체 ${targetLang}로 번역해.
- 반드시 JSON으로만 응답: {"original": "${sourceLang} 원문", "translated": "자연스러운 구어체 ${targetLang} 번역문"}`;

        const data = await callGeminiWithFallback({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents: [{
            role: "user",
            parts: [
              { text: `${contextText}[오디오 재인식 및 재번역: 화자의 ${sourceLang} 음성을 처음부터 다시 정확히 받아쓰고 ${targetLang}로 번역하세요]` },
              { inline_data: { mime_type: normalizeGeminiAudioMime(audioPayload.mime), data: audioPayload.data } }
            ]
          }],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 350,
            responseMimeType: "application/json"
          }
        }, { baseTimeoutMs: 7000, fallbackTimeoutMs: 9000 });

        const parts = data.candidates?.[0]?.content?.parts || [];
        let rawJson = "{}";
        for (const p of parts) {
          if (p.thought) continue;
          if (p.text) { rawJson = p.text.trim(); break; }
        }
        rawJson = rawJson.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
        const parsed = JSON.parse(rawJson);
        if (parsed.original && parsed.original.trim()) newOrig = parsed.original.trim();
        if (parsed.translated && parsed.translated.trim()) newTrans = parsed.translated.trim();
      } else {
        // 텍스트 메시지인 경우: 원문 의미를 벗어나지 않고 문맥에 맞게 정확히 재번역
        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(msgLang)}
- 원문의 뜻을 절대 바꾸거나 없는 말을 지어내지 말고, 문맥에 가장 자연스러운 구어체 ${targetLang} 번역문 1가지만 출력해. (설명 금지)`;

        const data = await callGeminiWithFallback({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents: [{
            role: "user",
            parts: [{ text: `${contextText}[${sourceLang} → ${targetLang} 재번역]\n${target.original}` }]
          }],
          generationConfig: {
            temperature: 0.3,
            maxOutputTokens: 280
          }
        }, { baseTimeoutMs: 5500, fallbackTimeoutMs: 7500 });

        const parts = data.candidates?.[0]?.content?.parts || [];
        for (const p of parts) {
          if (p.thought) continue;
          if (p.text) { newTrans = p.text.trim(); break; }
        }
      }

      if (newTrans) {
        const curIdx = roomState.messages.findIndex(m => m.ts === msgTs);
        if (curIdx !== -1) {
          const updated = roomState.messages.map((m, i) =>
            i === curIdx ? { ...m, original: newOrig, translated: newTrans } : m
          );
          roomState.messages = updated;
          lastRenderSig = "";
          renderMessages(true);

          const syncTs = Date.now();
          loadedMsgSyncTs = syncTs;
          await saveMessagesToDb(updated, syncTs, { upsertMsg: updated[curIdx] });
        }
      }
    } catch {
      alert(t().errTranslateFail);
    } finally {
      btnEl.textContent = origBtnText;
      btnEl.disabled = false;
    }
  }

  function loadImageFromFile(file, maxDim = 800) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          resolve({ img, w, h });
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoFileSelected(file) {
    if (!file) return;
    try {
      const { img, w, h } = await loadImageFromFile(file, 800);
      pendingPhotoImg = img;

      pendingPhotoBaseH = h;
      pendingPhotoRotation = 0;
      pendingStickers = [];
      selectedStickerId = null;
      draggingSticker = null;

      photoPreviewCanvas.width = w;

  function rotatePendingPhoto(deltaDeg) {
    if (!pendingPhotoImg) return;
    pendingPhotoRotation = (pendingPhotoRotation + deltaDeg + 360) % 360;
    const swap = (pendingPhotoRotation === 90 || pendingPhotoRotation === 270);
    photoPreviewCanvas.width = swap ? pendingPhotoBaseH : pendingPhotoBaseW;
    photoPreviewCanvas.height = swap ? pendingPhotoBaseW : pendingPhotoBaseH;

    pendingStickers.forEach(s => {
      const ox = s.x;
      const oy = s.y;
      if (deltaDeg > 0) {
        s.x = 1 - oy;
        s.y = ox;
      } else {
        s.x = oy;
        s.y = 1 - ox;
      }
    });
    renderPhotoPreviewCanvas(true);
  }

  function renderPhotoPreviewCanvas(showSelection = true) {
    if (!pendingPhotoImg) return;
    const ctx = photoPreviewCanvas.getContext("2d");
    const w = photoPreviewCanvas.width;
    const h = photoPreviewCanvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate((pendingPhotoRotation * Math.PI) / 180);
    ctx.drawImage(
      pendingPhotoImg,
      -pendingPhotoBaseW / 2,
      -pendingPhotoBaseH / 2,
      pendingPhotoBaseW,
      pendingPhotoBaseH
    );
    ctx.restore();

    const minDim = Math.min(w, h);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    pendingStickers.forEach(s => {
      const px = s.x * w;
      const py = s.y * h;
      const fontPx = Math.round(s.size * minDim);
      ctx.font = `${fontPx}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.fillText(s.emoji, px, py);

      if (showSelection && s.id === selectedStickerId) {
        ctx.save();
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = Math.max(3, Math.round(minDim * 0.006));
        ctx.setLineDash([8, 6]);
        const r = fontPx * 0.62;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  function updateStickerToolButtons() {

      id,
      emoji,

      y: Math.min(0.85, Math.max(0.15, 0.5 + offset)),

  function removeSelectedSticker() {

  function getCanvasNormCoords(canvas, clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width,
      y: (clientY - rect.top) / rect.height
    };
  }

  photoPreviewCanvas.addEventListener("pointerdown", (e) => {
    if (!pendingPhotoImg || pendingStickers.length === 0) return;
    const pt = getCanvasNormCoords(photoPreviewCanvas, e.clientX, e.clientY);
    const w = photoPreviewCanvas.width;
    const h = photoPreviewCanvas.height;
    const minDim = Math.min(w, h);

    let hit = null;
    for (let i = pendingStickers.length - 1; i >= 0; i--) {
      const s = pendingStickers[i];
      const dx = (pt.x - s.x) * w;
      const dy = (pt.y - s.y) * h;
      const radius = s.size * minDim * 0.7;
      if (Math.hypot(dx, dy) <= radius) {
        hit = s;
        break;
      }
    }

    if (hit) {
      selectedStickerId = hit.id;
      draggingSticker = hit;
      photoPreviewCanvas.setPointerCapture(e.pointerId);
    } else {
      selectedStickerId = null;
      draggingSticker = null;
    }
    renderPhotoPreviewCanvas(true);
    updateStickerToolButtons();
  });

  photoPreviewCanvas.addEventListener("pointermove", (e) => {
    if (!draggingSticker) return;
    const pt = getCanvasNormCoords(photoPreviewCanvas, e.clientX, e.clientY);
    draggingSticker.x = Math.min(0.95, Math.max(0.05, pt.x));
    draggingSticker.y = Math.min(0.95, Math.max(0.05, pt.y));
    renderPhotoPreviewCanvas(true);
  });

  photoPreviewCanvas.addEventListener("pointerup", () => { draggingSticker = null; });
  photoPreviewCanvas.addEventListener("pointercancel", () => { draggingSticker = null; });

  function clampPhotoTransform() {
    photoScale = Math.min(4, Math.max(1, photoScale));
    if (photoScale <= 1.01) {
      photoScale = 1;
      photoTx = 0;
      photoTy = 0;
    } else {
      const maxX = (window.innerWidth * (photoScale - 1)) / 2;
      const maxY = (window.innerHeight * (photoScale - 1)) / 2;
      photoTx = Math.min(maxX, Math.max(-maxX, photoTx));
      photoTy = Math.min(maxY, Math.max(-maxY, photoTy));
    }
  }

  function applyPhotoTransform(smooth = false) {
    clampPhotoTransform();
    photoModalImg.style.transition = smooth ? "transform 0.18s ease-out" : "none";
    photoModalImg.style.transform = `translate3d(${photoTx}px, ${photoTy}px, 0) scale(${photoScale})`;
  }

  function resetPhotoTransform() {
    photoScale = 1;
    photoTx = 0;
    photoTy = 0;
    isPanningPhoto = false;
    pinchStartDist = 0;
    applyPhotoTransform(false);
  }

  function getTouchDist(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  photoModalStage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      isPanningPhoto = false;
      pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
      pinchStartScale = photoScale;
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastPhotoTapAt < 280) {
        lastPhotoTapAt = 0;
        if (photoScale > 1.1) {
          photoScale = 1;
          photoTx = 0;
          photoTy = 0;
        } else {
          photoScale = 2.5;
          photoTx = 0;
          photoTy = 0;
        }
        applyPhotoTransform(true);
        return;
      }
      lastPhotoTapAt = now;

      if (photoScale > 1) {
        isPanningPhoto = true;
        panStartX = e.touches[0].clientX;
        panStartY = e.touches[0].clientY;
        panOriginTx = photoTx;
        panOriginTy = photoTy;
      }
    }
  }, { passive: true });

  photoModalStage.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      const dist = getTouchDist(e.touches[0], e.touches[1]);
      photoScale = pinchStartScale * (dist / pinchStartDist);
      applyPhotoTransform(false);
    } else if (e.touches.length === 1 && isPanningPhoto && photoScale > 1) {
      e.preventDefault();
      photoTx = panOriginTx + (e.touches[0].clientX - panStartX);
      photoTy = panOriginTy + (e.touches[0].clientY - panStartY);
      applyPhotoTransform(false);
    }
  }, { passive: false });

  photoModalStage.addEventListener("touchend", (e) => {
    if (e.touches.length < 2) pinchStartDist = 0;
    if (e.touches.length === 0) {
      isPanningPhoto = false;
      applyPhotoTransform(true);
    } else if (e.touches.length === 1 && photoScale > 1) {
      isPanningPhoto = true;
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panOriginTx = photoTx;
      panOriginTy = photoTy;
    }
  }, { passive: true });

  photoModalStage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.25 : -0.25;
    photoScale += delta;
    applyPhotoTransform(false);
  }, { passive: false });

  function toggleVideoRecordShutter() {
    if (!videoRecStream) return;
    if (!videoRecActive) {
      const mime = pickVideoRecorderMime();
      const opts = { videoBitsPerSecond: VIDEO_TARGET_BPS, audioBitsPerSecond: 64000 };
      if (mime) opts.mimeType = mime;

      videoRecChunks = [];
      videoRecDiscard = false;
      try {
        videoRecRecorder = new MediaRecorder(videoRecStream, opts);
      } catch {
        videoRecRecorder = new MediaRecorder(videoRecStream);
      }
      const actualMime = (videoRecRecorder.mimeType || mime || "video/webm").split(";")[0];

      videoRecRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) videoRecChunks.push(e.data);
      };
      videoRecRecorder.onstop = async () => {
        const elapsedSec = Math.max(1, Math.min(VIDEO_RECORD_MAX_SEC, Math.round((Date.now() - videoRecStartAt) / 1000)));
        const chunksCopy = videoRecChunks.slice();
        const wasDiscarded = videoRecDiscard;
        closeVideoRecordModal(false);
        if (!wasDiscarded && chunksCopy.length > 0) {
          const blob = new Blob(chunksCopy, { type: actualMime });
          await enqueueVideoForSending(blob, actualMime, elapsedSec, false);
        }
      };

      videoRecActive = true;
      videoRecStartAt = Date.now();
      videoRecShutterBtn.classList.add("recording");
      videoRecTimerBadge.classList.add("recording");
      videoRecHintText.textContent = t().videoRecRecording;

      videoRecRecorder.start(300);
      videoRecTimer = setInterval(() => {
        const sec = Math.floor((Date.now() - videoRecStartAt) / 1000);
        videoRecTimerBadge.textContent = `${formatDuration(Math.min(sec, VIDEO_RECORD_MAX_SEC), true)} / 00:30`;
        if (sec >= VIDEO_RECORD_MAX_SEC && videoRecActive) {
          videoRecActive = false;
          if (videoRecRecorder && videoRecRecorder.state !== "inactive") {
            videoRecRecorder.stop();
          }
        }
      }, 250);
    } else {
      videoRecActive = false;
      if (videoRecTimer) { clearInterval(videoRecTimer); videoRecTimer = null; }
      if (videoRecRecorder && videoRecRecorder.state !== "inactive") {
        videoRecRecorder.stop();
      }
    }
  }

    if (videoRecActive && videoRecRecorder && videoRecRecorder.state !== "inactive") {

  function inspectVideoFileMeta(fileOrBlob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(fileOrBlob);
      const vid = document.createElement("video");
      vid.preload = "metadata";
      vid.muted = true;
      vid.playsInline = true;
      vid.src = url;

      let settled = false;
      const done = (res) => {
        if (settled) return;
        settled = true;
        try { vid.removeAttribute("src"); vid.load(); } catch {}
        try { URL.revokeObjectURL(url); } catch {}
        resolve(res);
      };

      vid.onloadeddata = () => {
        const dur = (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 1;
        const seekTo = Math.min(0.2, dur * 0.1);
        vid.currentTime = seekTo;
      };

      vid.onseeked = () => {
        let thumbDataUrl = "";
        try {
          const vw = vid.videoWidth || 320;
          const vh = vid.videoHeight || 240;
          const maxW = 360;
          const scale = vw > maxW ? (maxW / vw) : 1;
          const cw = Math.max(2, Math.round(vw * scale));
          const ch = Math.max(2, Math.round(vh * scale));
          const c = document.createElement("canvas");
          c.width = cw;
          c.height = ch;
          c.getContext("2d").drawImage(vid, 0, 0, cw, ch);
          thumbDataUrl = c.toDataURL("image/jpeg", 0.65);
        } catch {}
        done({
          duration: (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 1,
          width: vid.videoWidth || 640,
          height: vid.videoHeight || 480,
          thumbDataUrl
        });
      };

      vid.onerror = () => done({ duration: 1, width: 640, height: 480, thumbDataUrl: "" });
      setTimeout(() => done({
        duration: (isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 1,
        width: vid.videoWidth || 640,
        height: vid.videoHeight || 480,
        thumbDataUrl: ""
      }), 3500);
    });
  }

  async function handleVideoFileSelected(file, fromNativeCapture = false) {
    if (!file || !roomPass) return;
    const meta = await inspectVideoFileMeta(file);
    const maxAllowedSec = fromNativeCapture ? VIDEO_RECORD_MAX_SEC : VIDEO_GALLERY_MAX_SEC;
    const needsTranscode = (file.size > VIDEO_GALLERY_MAX_BYTES) || (meta.duration > maxAllowedSec + 0.5);
    const displayDur = Math.max(1, Math.min(maxAllowedSec, Math.round(meta.duration)));
    await enqueueVideoForSending(file, file.type || "video/mp4", displayDur, needsTranscode, meta.thumbDataUrl);
  }

  async function enqueueVideoForSending(fileOrBlob, mime, durationSec, needsTranscode, preThumb = "") {
    if (!roomPass) return;
    const msgTs = Date.now();
    let thumbDataUrl = preThumb;
    if (!thumbDataUrl) {
      const meta = await inspectVideoFileMeta(fileOrBlob);
      thumbDataUrl = meta.thumbDataUrl;
    }

    const inCallNow = (callState !== "idle");
    const initState = inCallNow ? "paused" : (needsTranscode ? "transcoding" : "uploading");
    videoJobStatusMap[msgTs] = { state: initState, progress: 0 };

    const newMsg = {
      lang: myRole,
      original: "",
      translated: "",
      hasAudio: false,
      hasPhoto: false,
      hasVideo: true,
      videoReady: false,
      videoExpired: false,
      videoDuration: durationSec,
      videoThumb: thumbDataUrl,
      liked: false,
      replyTo: replyTarget ? { ...replyTarget } : null,
      ts: msgTs
    };
    clearReplyTarget();

    const updatedMessages = buildUpdatedMessages(newMsg);
    roomState.messages = updatedMessages;
    lastRenderSig = "";
    renderMessages(false);

    await idbPut("video_queue", {
      ts: msgTs,
      blob: fileOrBlob,
      mime: mime || "video/mp4",
      durationSec,
      needsTranscode: Boolean(needsTranscode)
    });

    pendingVideoQueue.push({
      ts: msgTs,
      blob: fileOrBlob,
      mime: mime || "video/mp4",
      durationSec,
      needsTranscode: Boolean(needsTranscode)
    });

    const syncTs = Date.now();
    loadedMsgSyncTs = syncTs;
    await saveMessagesToDb(updatedMessages, syncTs, { upsertMsg: newMsg });

    if (!inCallNow && !videoQueuePaused) {
      processNextVideoJob();
    }
  }

  /* ================= 전체화면 동영상 플레이어 (전체화면 · 회전 버튼 분리) ================= */

  const videoModal = document.getElementById("videoModal");
  const videoModalPlayer = document.getElementById("videoModalPlayer");
  const videoModalLoading = document.getElementById("videoModalLoading");
  const videoFullscreenBtn = document.getElementById("videoFullscreenBtn");
  const videoRotateBtn = document.getElementById("videoRotateBtn");

  let currentVideoObjectUrl = "";
  let currentModalVideoTs = 0;
  let currentModalVideoMime = "video/mp4";
  let isVideoModalLandscape = false;

  async function openVideoModal(msg) {
    if (!msg || !msg.ts || isVideoExpiredMsg(msg)) return;
    stopCurrentAudio();
    currentModalVideoTs = msg.ts;
    isVideoModalLandscape = false;
    videoModal.classList.remove("force-landscape");
    videoRotateBtn.classList.remove("active");
    videoFullscreenBtn.classList.remove("active");
    videoFullscreenBtn.textContent = t().videoFullscreen;

    videoModalLoading.textContent = t().videoLoading;
    videoModalLoading.classList.remove("hidden");
    videoModalPlayer.removeAttribute("src");
    videoModal.classList.remove("hidden");
    ensureModalHistory();

    try {
      let cached = videoCache[msg.ts];
      if (!cached) {
        const fromIdb = await idbGet("videos", msg.ts);
        if (fromIdb && fromIdb.data) {
          cached = { data: fromIdb.data, mime: fromIdb.mime };
          videoCache[msg.ts] = cached;
        }
      }
      if (!cached) {
        const res = await fetchWithTimeout(`${getVideoBaseUrl()}/${msg.ts}.json`, { method: "GET" }, 35000);
        if (!res.ok) throw new Error("video_fetch_failed");
        cached = await res.json();
        if (!cached || !cached.data) {
          closeVideoModal(false);
          await markVideoFailedOrExpired(msg.ts);
          return;
        }
        trackFirebaseTraffic((cached.data || "").length + 64);
        videoCache[msg.ts] = cached;
        idbPut("videos", { ts: msg.ts, data: cached.data, mime: cached.mime });
      }

      if (videoModal.classList.contains("hidden") || currentModalVideoTs !== msg.ts) return;

      currentModalVideoMime = cached.mime || "video/mp4";
      const blobUrl = base64ToBlobUrl(cached.data, currentModalVideoMime);
      if (currentVideoObjectUrl && currentVideoObjectUrl.startsWith("blob:")) {
        try { URL.revokeObjectURL(currentVideoObjectUrl); } catch {}
      }
      currentVideoObjectUrl = blobUrl;

      videoModalPlayer.src = blobUrl;
      videoModalLoading.classList.add("hidden");
      videoModalPlayer.play().catch(() => {});
    } catch {
      videoModalLoading.classList.add("hidden");
      if (!videoModal.classList.contains("hidden")) {
        closeVideoModal(false);
      }
    }
  }

  async function toggleVideoModalFullscreen() {
    if (videoModal.classList.contains("hidden")) return;
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        videoFullscreenBtn.classList.remove("active");
        videoFullscreenBtn.textContent = t().videoFullscreen;
        return;
      }
      if (videoModal.requestFullscreen) {
        await videoModal.requestFullscreen();
        videoFullscreenBtn.classList.add("active");
        videoFullscreenBtn.textContent = t().videoExitFullscreen;
        return;
      }
      if (typeof videoModalPlayer.webkitEnterFullscreen === "function") {
        videoModalPlayer.webkitEnterFullscreen();
      }
    } catch {
      if (typeof videoModalPlayer.webkitEnterFullscreen === "function") {
        try { videoModalPlayer.webkitEnterFullscreen(); } catch {}
      }
    }
  }

  async function toggleVideoModalRotate() {
    if (videoModal.classList.contains("hidden")) return;

    // iOS Safari에서는 애플 정책상 웹 코드 단독 회전 대신 네이티브 플레이어로 가로 회전 지원
    if (isIOSDevice() && typeof videoModalPlayer.webkitEnterFullscreen === "function") {
      try { videoModalPlayer.webkitEnterFullscreen(); } catch {}
      return;
    }

    isVideoModalLandscape = !isVideoModalLandscape;
    const targetOrient = isVideoModalLandscape ? "landscape" : "portrait";

    try {
      if (screen.orientation && typeof screen.orientation.lock === "function") {
        if (isVideoModalLandscape && !document.fullscreenElement && videoModal.requestFullscreen) {
          await videoModal.requestFullscreen().catch(() => {});
        }
        await screen.orientation.lock(targetOrient);
        videoModal.classList.remove("force-landscape");
        videoRotateBtn.classList.toggle("active", isVideoModalLandscape);
        return;
      }
    } catch {}

    // 브라우저가 orientation.lock을 지원하지 않는 환경에서는 CSS 90도 회전 모드로 전환
    videoModal.classList.toggle("force-landscape", isVideoModalLandscape);
    videoRotateBtn.classList.toggle("active", isVideoModalLandscape);
  }

  document.addEventListener("fullscreenchange", () => {
    const isFs = Boolean(document.fullscreenElement);
    if (videoFullscreenBtn) {
      videoFullscreenBtn.classList.toggle("active", isFs);
      videoFullscreenBtn.textContent = isFs ? t().videoExitFullscreen : t().videoFullscreen;
    }

  function downloadCurrentVideo() {
    if (!currentVideoObjectUrl) return;
    if (!confirm(t().confirmSaveVideo)) return;
    const ext = currentModalVideoMime.includes("webm") ? "webm" : "mp4";
    const a = document.createElement("a");

  function closeVideoModal(fromPopState = false) {
    if (videoModal.classList.contains("hidden")) return;

      videoModalPlayer.removeAttribute("src");
      videoModalPlayer.load();

      try { URL.revokeObjectURL(currentVideoObjectUrl); } catch {}
    }
    currentVideoObjectUrl = "";
    currentModalVideoTs = 0;
    isVideoModalLandscape = false;
    videoModal.classList.remove("force-landscape");
    videoRotateBtn.classList.remove("active");
    videoFullscreenBtn.classList.remove("active");
    videoFullscreenBtn.textContent = t().videoFullscreen;

    try {
      if (screen.orientation && typeof screen.orientation.unlock === "function") {
        screen.orientation.unlock();
      }
    } catch {}
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});

    videoModal.classList.add("hidden");

  /* ================= 영상통화 상시 실시간 낙서 ================= */

  function downsamplePoints(points, maxCount = 140) {
    if (!points || points.length <= maxCount) return points;
    const result = [];
    const step = (points.length - 1) / (maxCount - 1);
    for (let i = 0; i < maxCount; i++) {
      result.push(points[Math.round(i * step)]);
    }
    return result;
  }

  function resizeDoodleCanvas() {
    const w = doodleCanvas.clientWidth;
    const h = doodleCanvas.clientHeight;
    if (w > 0 && h > 0 && (doodleCanvas.width !== w || doodleCanvas.height !== h)) {
      doodleCanvas.width = w;
      doodleCanvas.height = h;
    }
  }

  window.addEventListener("resize", resizeDoodleCanvas);

  function startDoodleLoop() {
    if (doodleRaf) return;
    const step = () => {
      resizeDoodleCanvas();
      const ctx = doodleCanvas.getContext("2d");
      const w = doodleCanvas.width;
      const h = doodleCanvas.height;
      ctx.clearRect(0, 0, w, h);

      const now = Date.now();
      const HOLD_MS = 1500;
      const FADE_MS = 1000;

      activeDoodles = activeDoodles.filter(st => (now - st.createdAt) < (HOLD_MS + FADE_MS));

      const drawStroke = (points, color, alpha) => {
        if (!points || points.length < 2) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(points[0][0] * w, points[0][1] * h);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i][0] * w, points[i][1] * h);
        }
        ctx.stroke();
        ctx.restore();
      };

      activeDoodles.forEach(st => {
        const age = now - st.createdAt;
        const alpha = age <= HOLD_MS ? 1 : Math.max(0, 1 - (age - HOLD_MS) / FADE_MS);
        drawStroke(st.points, st.color, alpha);
      });

      if (currentDoodleStroke && currentDoodleStroke.points.length >= 2) {
        drawStroke(currentDoodleStroke.points, currentDoodleStroke.color, 1);
      }

      if (activeDoodles.length > 0 || currentDoodleStroke) {
        doodleRaf = requestAnimationFrame(step);
      } else {
        doodleRaf = null;
      }
    };
    doodleRaf = requestAnimationFrame(step);
  }

  doodleCanvas.addEventListener("pointerdown", (e) => {
    if (callState !== "active" && callState !== "test" && callState !== "outgoing") return;
    resizeDoodleCanvas();
    const rect = doodleCanvas.getBoundingClientRect();
    const nx = Number(((e.clientX - rect.left) / rect.width).toFixed(3));
    const ny = Number(((e.clientY - rect.top) / rect.height).toFixed(3));
    doodlePointerId = e.pointerId;
    doodleTotalDist = 0;

    if (callState === "active" || callState === "test") {
      currentDoodleStroke = {
        points: [[nx, ny]],
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        color: myRole === "ko" ? "#00e5ff" : "#ff4081"
      };
      startDoodleLoop();
    } else {
      currentDoodleStroke = {
        points: [],
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        color: ""
      };
    }
    doodleCanvas.setPointerCapture(e.pointerId);
  });

  doodleCanvas.addEventListener("pointermove", (e) => {
    if (!currentDoodleStroke || e.pointerId !== doodlePointerId) return;
    const dx = e.clientX - currentDoodleStroke.lastClientX;
    const dy = e.clientY - currentDoodleStroke.lastClientY;
    const dist = Math.hypot(dx, dy);
    if (dist < 4) return;
    doodleTotalDist += dist;
    currentDoodleStroke.lastClientX = e.clientX;
    currentDoodleStroke.lastClientY = e.clientY;

    if (callState === "active" || callState === "test") {
      const rect = doodleCanvas.getBoundingClientRect();
      const nx = Number(((e.clientX - rect.left) / rect.width).toFixed(3));
      const ny = Number(((e.clientY - rect.top) / rect.height).toFixed(3));
      currentDoodleStroke.points.push([nx, ny]);
    }
  });

  function finishDoodleStroke(e) {
    if (!currentDoodleStroke || (e && e.pointerId !== doodlePointerId)) return;
    const finished = currentDoodleStroke;
    currentDoodleStroke = null;
    doodlePointerId = null;

    if (doodleTotalDist < 14) {
      if (liveAudioCtx && liveAudioCtx.state === "suspended") {
        liveAudioCtx.resume().catch(() => {});
      }
      if (isVideoFull) {
        isVideoMenuOpen = !isVideoMenuOpen;
        document.body.classList.toggle("video-menu-open", isVideoMenuOpen);
      }
      return;
    }

    if ((callState === "active" || callState === "test") && finished.points.length >= 3) {
      const now = Date.now();
      activeDoodles.push({ points: finished.points, color: finished.color, createdAt: now });
      startDoodleLoop();

      if (callState === "active" && roomPass) {
        const id = `${now}_${Math.random().toString(36).slice(2, 6)}`;
        const compactPoints = downsamplePoints(finished.points, 140);
        myDoodleEvents = myDoodleEvents.filter(d => now - d.ts < 8000);
        myDoodleEvents.push({ id, points: compactPoints, color: finished.color, ts: now });
        if (myDoodleEvents.length > 6) myDoodleEvents = myDoodleEvents.slice(-6);
        patchRoom({ [`doodleBurst/${myRole}`]: myDoodleEvents });

        if (doodleClearTimer) clearTimeout(doodleClearTimer);
        doodleClearTimer = setTimeout(() => {
          myDoodleEvents = [];
          if (roomPass) patchRoom({ [`doodleBurst/${myRole}`]: null });
        }, 9000);
      }
    }
  }

  doodleCanvas.addEventListener("pointerup", finishDoodleStroke);
  doodleCanvas.addEventListener("pointercancel", finishDoodleStroke);

  function handleIncomingDoodleBurst(burstMap) {
    const otherList = Array.isArray(burstMap?.[getOtherRole()]) ? burstMap[getOtherRole()] : [];
    const now = Date.now();

    if (!doodleInitialized) {
      otherList.forEach(ev => { if (ev && ev.id) seenDoodleIds.add(ev.id); });
      doodleInitialized = true;
      return;
    }

    if (callState !== "active") return;

    const fresh = otherList.filter(ev => ev && ev.id && !seenDoodleIds.has(ev.id) && (now - ev.ts < 8000));
    if (fresh.length > 0) {
      fresh.forEach(ev => {
        seenDoodleIds.add(ev.id);
        activeDoodles.push({
          points: ev.points,
          color: ev.color || "#ff4081",
          createdAt: Date.now()
        });
      });
      startDoodleLoop();
    }

    if (seenDoodleIds.size > 100) {
      seenDoodleIds = new Set(Array.from(seenDoodleIds).slice(-50));
    }
  }

  /* ================= 영상통화 실시간 번역 엔진 (VAD + 비동기 파이프라인 + 영역 분리) ================= */

  function isLiveCallReady() {
    return (callState === "active" || callState === "test") && Boolean(localStream);
  }

  function updateLiveCallUI() {
    const inLiveEligibleCall = (callState === "active" || callState === "test");
    if (vcLiveBtn) {
      vcLiveBtn.classList.toggle("active", isLiveTranslateEnabled);
      vcLiveBtn.classList.toggle("off", !isLiveTranslateEnabled);
      vcLiveBtn.classList.toggle("slash", !isLiveTranslateEnabled);
    }

    if (!inLiveEligibleCall) {
      liveCallBox.classList.add("hidden");
      micBtn.classList.remove("hidden");
      return;
    }

    if (isLiveTranslateEnabled) {
      micBtn.classList.add("hidden");
      liveCallBox.classList.remove("hidden");

    } else {
      liveCallBox.classList.add("hidden");
      micBtn.classList.remove("hidden");
    }
  }

  function refreshLiveCallBoxState() {
    const text = t();
    liveCallBox.classList.remove("speaking", "muted");
    if (isMuted) {
      liveCallBox.classList.add("muted");
      liveCallStatus.textContent = text.liveStatusMuted;
      liveMiniVolBar.style.width = "4%";
    } else if (liveSpeaking) {

  function showMyLiveResult(orig, trans) {
    if (myLiveClearTimer) { clearTimeout(myLiveClearTimer); myLiveClearTimer = null; }
    liveMyText.textContent = orig || "";
    if (trans && trans !== orig) {

  function prepareLiveAudioContext() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!liveAudioCtx || liveAudioCtx.state === "closed") {

  function abortActiveManualRecording() {

      if (mediaRecorder && mediaRecorder.state !== "inactive") {

  function toggleLiveTranslate() {
    if (callState !== "active" && callState !== "test") return;
    isLiveTranslateEnabled = !isLiveTranslateEnabled;

  function startLiveSpeechPreview() {
    // 영상통화 중 내장 SpeechRecognition 동시 실행 시 안드로이드/모바일 <video> 멈춤 현상을 유발할 수 있어 생략
    return;
    if (isIOSDevice()) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    stopLiveSpeechPreview();
    try {
      const rec = new SR();
      rec.lang = myRole === "ko" ? "ko-KR" : "vi-VN";
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (event) => {
        if (!liveVadActive || !isLiveTranslateEnabled || isMuted) return;
        let fin = "";
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const r = event.results[i];
          const txt = (r[0] && r[0].transcript) ? r[0].transcript : "";
          if (r.isFinal) fin += txt + " ";
          else interim += txt;
        }
        if (fin.trim()) liveFinalBuffer = `${liveFinalBuffer} ${fin.trim()}`.trim();
        liveInterimText = interim.trim();
        refreshLiveCallBoxState();
      };
      rec.onerror = () => {};
      rec.onend = () => {
        if (liveSpeechRec === rec) {
          liveSpeechRec = null;
          if (liveVadActive && isLiveTranslateEnabled && !isMuted && !isIOSDevice()) {
            setTimeout(() => {
              if (liveVadActive && isLiveTranslateEnabled && !isMuted && !liveSpeechRec) {
                startLiveSpeechPreview();
              }
            }, 400);
          }
        }
      };
      liveSpeechRec = rec;
      rec.start();
    } catch {
      liveSpeechRec = null;
    }
  }

  function stopLiveSpeechPreview() {
    liveInterimText = "";
    liveFinalBuffer = "";
    if (liveSpeechRec) {
      const r = liveSpeechRec;
      liveSpeechRec = null;
      try { r.onresult = null; r.onerror = null; r.onend = null; r.stop(); } catch {}
    }
  }

  function encodePcmToWavBlob(chunks, inputRate, targetRate = LIVE_WAV_SAMPLE_RATE) {
    let totalLen = 0;
    for (let i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
    const merged = new Float32Array(totalLen);
    let offset = 0;
    for (let i = 0; i < chunks.length; i++) {
      merged.set(chunks[i], offset);
      offset += chunks[i].length;
    }

    let samples = merged;
    let outRate = inputRate;
    if (inputRate > targetRate) {
      const ratio = inputRate / targetRate;
      const newLen = Math.max(1, Math.floor(merged.length / ratio));
      samples = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const idx = i * ratio;
        const i0 = Math.floor(idx);
        const i1 = Math.min(i0 + 1, merged.length - 1);
        const frac = idx - i0;
        samples[i] = merged[i0] + (merged[i1] - merged[i0]) * frac;
      }
      outRate = targetRate;
    }

    const dataBytes = samples.length * 2;
    const buffer = new ArrayBuffer(44 + dataBytes);
    const view = new DataView(buffer);
    const writeStr = (pos, str) => {
      for (let i = 0; i < str.length; i++) view.setUint8(pos + i, str.charCodeAt(i));
    };

    writeStr(0, "RIFF");
    view.setUint32(4, 36 + dataBytes, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, outRate, true);
    view.setUint32(28, outRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, "data");
    view.setUint32(40, dataBytes, true);

    let p = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      p += 2;
    }
    return new Blob([buffer], { type: "audio/wav" });
  }

  function finishLivePcmCapture(discard = false) {
    const chunksCopy = liveSpeechPcmChunks.slice();
    const voicedMsCopy = liveVoicedMs;
    const durMs = liveSpeechStartAt ? (Date.now() - liveSpeechStartAt) : 0;
    const hintText = `${liveFinalBuffer} ${liveInterimText}`.trim();

    liveSpeaking = false;
    liveSpeechPcmChunks = [];
    liveVoicedMs = 0;
    liveSpeechStartAt = 0;
    liveFinalBuffer = "";
    liveInterimText = "";
    refreshLiveCallBoxState();

    if (discard || durMs < LIVE_MIN_SPEECH_MS || voicedMsCopy < LIVE_MIN_VOICED_MS || chunksCopy.length === 0) {
      return;
    }

    const wavBlob = encodePcmToWavBlob(chunksCopy, liveSampleRate, LIVE_WAV_SAMPLE_RATE);
    processLiveUtterance(wavBlob, "audio/wav", hintText);
  }

  function startLiveTranslateEngine() {
    if (!isLiveCallReady() || !isLiveTranslateEnabled || isMuted) return;
    if (liveVadActive) return;

    const tracks = localStream.getAudioTracks();
    if (!tracks || tracks.length === 0) return;

    try {
      // iOS Safari에서는 WebRTC 오디오 트랙을 clone()하면 무음(0)이 나오는 경우가 있어 원본 트랙 직접 연결
      if (isIOSDevice()) {
        liveSourceStream = new MediaStream([tracks[0]]);
        liveStopSourceOnFinish = false;
      } else {
        try {
          const cloned = tracks[0].clone();
          cloned.enabled = true;
          liveSourceStream = new MediaStream([cloned]);
          liveStopSourceOnFinish = true;
        } catch {
          liveSourceStream = new MediaStream([tracks[0]]);
          liveStopSourceOnFinish = false;
        }
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!liveAudioCtx || liveAudioCtx.state === "closed") {
        liveAudioCtx = new AudioContextClass();
      }
      if (liveAudioCtx.state === "suspended") {
        liveAudioCtx.resume().catch(() => {});
      }
      liveSampleRate = liveAudioCtx.sampleRate || 48000;
      const maxPreRollSamples = Math.round(liveSampleRate * (LIVE_PREROLL_MS / 1000));

      const src = liveAudioCtx.createMediaStreamSource(liveSourceStream);
      liveProcessor = liveAudioCtx.createScriptProcessor(2048, 1, 1);
      liveZeroGain = liveAudioCtx.createGain();
      // 0 대신 들리지 않는 극소값(0.0001)을 연결해 iOS WebKit의 오디오 그래프 절전 중지 방지
      liveZeroGain.gain.value = 0.0001;

      src.connect(liveProcessor);
      liveProcessor.connect(liveZeroGain);
      liveZeroGain.connect(liveAudioCtx.destination);

      if (liveResumeTimer) clearInterval(liveResumeTimer);
      liveResumeTimer = setInterval(() => {
        if (liveVadActive && liveAudioCtx && liveAudioCtx.state === "suspended") {
          liveAudioCtx.resume().catch(() => {});
        }
      }, 1500);

      liveVadActive = true;
      liveNoiseFloor = 0.008;
      liveRmsWindow = [];
      liveSpeaking = false;
      liveOnsetAt = 0;
      liveVoicedMs = 0;
      liveSpeechStartAt = 0;
      liveLastVoiceAt = 0;
      livePreRollChunks = [];
      livePreRollSamples = 0;
      liveSpeechPcmChunks = [];
      liveMyText.textContent = t().livePlaceholderIdle;
      liveMyTrans.textContent = "";
      liveMyTrans.classList.add("hidden");

      startLiveSpeechPreview();
      refreshLiveCallBoxState();

      liveProcessor.onaudioprocess = (event) => {
        if (!liveVadActive) return;
        const input = event.inputBuffer.getChannelData(0);
        if (!input || input.length === 0) return;

        if (isRecording || isMuted) {
          liveMiniVolBar.style.width = "4%";
          liveOnsetAt = 0;
          liveRmsWindow = [];
          livePreRollChunks = [];
          livePreRollSamples = 0;
          if (liveSpeaking) finishLivePcmCapture(true);
          return;
        }

        let sumSq = 0;
        for (let i = 0; i < input.length; i++) {
          const v = input[i];
          sumSq += v * v;
        }
        const rms = Math.sqrt(sumSq / input.length);
        const now = Date.now();
        if (now - liveLastVolBarAt >= 120) {
          liveLastVolBarAt = now;
          const pct = Math.min(100, Math.max(4, Math.round(rms * 600)));
          liveMiniVolBar.style.width = `${pct}%`;
        }
        const chunkMs = (input.length / liveSampleRate) * 1000;
        const chunkCopy = new Float32Array(input);

        // 최근 ~1.5초 구간의 하위 20% 바닥 소음 추적 (녹음 중에도 식당 배경소음에 맞춰 자동 상향)
        liveRmsWindow.push(rms);
        if (liveRmsWindow.length > 36) liveRmsWindow.shift();

        if (!liveSpeaking) {
          if (rms > liveNoiseFloor) {
            liveNoiseFloor = liveNoiseFloor * 0.92 + Math.min(rms, 0.09) * 0.08;
          } else {
            liveNoiseFloor = liveNoiseFloor * 0.97 + rms * 0.03;
          }
        } else if (liveRmsWindow.length >= 16) {
          const sorted = liveRmsWindow.slice().sort((a, b) => a - b);
          const p20 = sorted[Math.floor(sorted.length * 0.2)];
          if (p20 > liveNoiseFloor) {
            liveNoiseFloor = liveNoiseFloor * 0.95 + Math.min(p20, 0.09) * 0.05;
          } else {
            liveNoiseFloor = liveNoiseFloor * 0.985 + p20 * 0.015;
          }
        }
        liveNoiseFloor = Math.min(0.075, Math.max(0.004, liveNoiseFloor));

        // peak 단독 트리거 제거: RMS가 주변 바닥 소음보다 확실히 클 때만 발화로 인정
        const rmsThreshold = Math.max(0.014, liveNoiseFloor * 2.1 + 0.006);
        const isVoiceNow = (rms > rmsThreshold);

        if (!liveSpeaking) {
          // 0.55초 블랙박스 프리롤 링 버퍼 유지 (말 앞부분 잘림 방지)
          livePreRollChunks.push(chunkCopy);
          livePreRollSamples += chunkCopy.length;
          while (livePreRollSamples > maxPreRollSamples && livePreRollChunks.length > 1) {
            livePreRollSamples -= livePreRollChunks.shift().length;
          }

          if (isVoiceNow) {
            if (!liveOnsetAt) liveOnsetAt = now;
            if (now - liveOnsetAt >= LIVE_ONSET_MS) {
              liveSpeaking = true;
              liveSpeechStartAt = now;
              liveLastVoiceAt = now;
              liveVoicedMs = LIVE_ONSET_MS;
              liveOnsetAt = 0;
              liveSpeechPcmChunks = livePreRollChunks.slice();
              livePreRollChunks = [];
              livePreRollSamples = 0;
              refreshLiveCallBoxState();
            }
          } else if (rms < rmsThreshold * 0.80) {
            liveOnsetAt = 0;
          }
        } else {
          liveSpeechPcmChunks.push(chunkCopy);
          if (rms > rmsThreshold * 0.70) {
            liveLastVoiceAt = now;
            liveVoicedMs += chunkMs;
          }
          const elapsed = now - liveSpeechStartAt;
          const silenceFor = now - liveLastVoiceAt;
          if (silenceFor >= LIVE_SILENCE_MS || elapsed >= LIVE_MAX_CHUNK_MS) {
            finishLivePcmCapture(false);
          }
        }
      };
    } catch {
      stopLiveTranslateEngine(false);
    }
  }

  function stopLiveTranslateEngine(clearText = false) {
    liveVadActive = false;
    liveOnsetAt = 0;
    liveRmsWindow = [];
    livePreRollChunks = [];
    livePreRollSamples = 0;
    if (liveResumeTimer) { clearInterval(liveResumeTimer); liveResumeTimer = null; }
    stopLiveSpeechPreview();
    if (liveSpeaking) {
      finishLivePcmCapture(true);
    } else {
      liveSpeechPcmChunks = [];
      liveVoicedMs = 0;
      liveSpeechStartAt = 0;
    }
    if (liveProcessor) {
      liveProcessor.onaudioprocess = null;
      try { liveProcessor.disconnect(); } catch {}
      liveProcessor = null;
    }
    if (liveZeroGain) {
      try { liveZeroGain.disconnect(); } catch {}
      liveZeroGain = null;
    }
    if (liveAudioCtx) { liveAudioCtx.close().catch(() => {}); liveAudioCtx = null; }
    if (liveSourceStream) {
      if (liveStopSourceOnFinish) liveSourceStream.getTracks().forEach(tr => tr.stop());
      liveSourceStream = null;
      liveStopSourceOnFinish = false;
    }
    liveMiniVolBar.style.width = "4%";
    if (clearText) {
      if (myLiveClearTimer) { clearTimeout(myLiveClearTimer); myLiveClearTimer = null; }
      liveMyText.textContent = "";
      liveMyTrans.textContent = "";
      liveMyTrans.classList.add("hidden");
    }
  }

  async function processLiveUtterance(audioBlob, cleanMime, speechHint = "") {
    if (!apiKey || !roomPass) return;
    if (callState !== "active" && callState !== "test") return;

    liveInFlightCount++;
    refreshLiveCallBoxState();

    try {
      const slCode = myRole === "ko" ? "ko" : "vi";
      const sourceLang = myRole === "ko" ? "한국어" : "베트남어";
      const targetLang = myRole === "ko" ? "베트남어" : "한국어";

      let orig = "";
      let trans = "";

      const groqRes = await transcribeWithGroq(audioBlob, cleanMime, slCode, { strictNoSpeech: true });
      if (groqRes.ok) {
        orig = groqRes.text;
      } else if (speechHint) {
        orig = speechHint;
      }

      if (orig) {
        trans = await translateTextForLang(orig, myRole);
      } else if (!groqRes.ok) {
        // Groq 실패 시 Gemini 오디오 직접 청취 백업 (MIME 정규화 적용)
        const base64Audio = await blobToBase64(audioBlob);
        const systemInstruction = `너는 한국어와 베트남어 실시간 전문 통역사야.
[규칙]
${getHonorificRule(myRole)}
- 배경 잡음은 무시하고 화자의 ${sourceLang} 목소리만 받아써서 반드시 ${targetLang}로 번역해.
- 말 없이 잡음뿐이면 {"original": "", "translated": ""} 반환.
- 반드시 JSON으로만 응답: {"original": "${sourceLang} 원문", "translated": "${targetLang} 번역문"}`;
        const data = await callGeminiWithFallback({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents: [{
            role: "user",
            parts: [
              { text: `[실시간 영상통화 통역: ${sourceLang} → ${targetLang}]` },
              { inline_data: { mime_type: normalizeGeminiAudioMime(cleanMime), data: base64Audio } }
            ]
          }],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 260,
            responseMimeType: "application/json"
          }
        }, { baseTimeoutMs: 6500, fallbackTimeoutMs: 8000 });

        const parts = data.candidates?.[0]?.content?.parts || [];
        let rawJson = "{}";
        for (const p of parts) {
          if (p.thought) continue;
          if (p.text) { rawJson = p.text.trim(); break; }
        }
        rawJson = rawJson.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
        const parsed = JSON.parse(rawJson);
        orig = (parsed.original || "").trim();
        trans = (parsed.translated || "").trim();
      }

      if (!orig) return;
      const finalTrans = (trans || orig).trim();
      showMyLiveResult(orig, finalTrans);

      if (callState === "active") {
        broadcastLiveSubtitle(orig, finalTrans);
      } else if (callState === "test") {
        // 1인 테스트 모드에서는 상단 상대방 자막 영역에도 미리보기 표시
        pushPartnerSubtitleItem({
          id: `test_${Date.now()}`,
          orig,
          trans: finalTrans,
          isTest: true
        });
      }
    } catch {
      // 실시간 자막 실패는 통화를 방해하지 않도록 조용히 무시
    } finally {
      liveInFlightCount = Math.max(0, liveInFlightCount - 1);
      refreshLiveCallBoxState();
    }
  }

  function broadcastLiveSubtitle(orig, trans) {
    if (!roomPass || callState !== "active") return;
    const now = Date.now();
    const id = `${now}_${Math.random().toString(36).slice(2, 6)}`;
    myLiveSubEvents = myLiveSubEvents.filter(e => now - e.ts < 12000);
    myLiveSubEvents.push({ id, orig, trans, ts: now });
    if (myLiveSubEvents.length > 5) myLiveSubEvents = myLiveSubEvents.slice(-5);

    patchRoom({ [`liveSubtitles/${myRole}`]: myLiveSubEvents });

    if (liveSubClearTimer) clearTimeout(liveSubClearTimer);
    liveSubClearTimer = setTimeout(() => {
      myLiveSubEvents = [];
      if (roomPass) patchRoom({ [`liveSubtitles/${myRole}`]: null });
    }, 13000);
  }

  function pushPartnerSubtitleItem(item) {
    const expiresAt = Date.now() + LIVE_SUBTITLE_TTL_MS;
    partnerSubtitleQueue.push({ ...item, expiresAt });
    if (partnerSubtitleQueue.length > LIVE_SUBTITLE_MAX_LINES) {
      partnerSubtitleQueue = partnerSubtitleQueue.slice(-LIVE_SUBTITLE_MAX_LINES);
    }
    renderPartnerSubtitleStack();
    schedulePartnerSubtitlePrune();
  }

  function renderPartnerSubtitleStack() {
    const now = Date.now();
    partnerSubtitleQueue = partnerSubtitleQueue.filter(it => it.expiresAt > now);
    partnerSubtitleStack.innerHTML = "";
    if (callState !== "active" && callState !== "test") return;

    partnerSubtitleQueue.forEach(it => {
      const div = document.createElement("div");
      div.className = "partner-sub-item" + (it.isTest ? " test-preview" : "");
      const transEl = document.createElement("div");
      transEl.className = "partner-sub-trans";
      transEl.textContent = it.trans || it.orig || "";
      div.appendChild(transEl);

      if (it.orig && it.orig !== it.trans) {
        const origEl = document.createElement("div");
        origEl.className = "partner-sub-orig";
        origEl.textContent = it.orig;
        div.appendChild(origEl);
      }
      partnerSubtitleStack.appendChild(div);
    });
  }

  function schedulePartnerSubtitlePrune() {
    if (partnerSubtitlePruneTimer) clearTimeout(partnerSubtitlePruneTimer);
    if (partnerSubtitleQueue.length === 0) {
      partnerSubtitlePruneTimer = null;
      return;
    }
    const nextExpiry = Math.min(...partnerSubtitleQueue.map(it => it.expiresAt));
    const waitMs = Math.max(150, nextExpiry - Date.now() + 50);
    partnerSubtitlePruneTimer = setTimeout(() => {
      renderPartnerSubtitleStack();
      schedulePartnerSubtitlePrune();
    }, waitMs);
  }

  function clearPartnerSubtitleStack() {
    partnerSubtitleQueue = [];
    if (partnerSubtitlePruneTimer) {
      clearTimeout(partnerSubtitlePruneTimer);
      partnerSubtitlePruneTimer = null;
    }
    partnerSubtitleStack.innerHTML = "";
  }

  function handleIncomingLiveSubtitles(subMap) {
    const otherList = Array.isArray(subMap?.[getOtherRole()]) ? subMap[getOtherRole()] : [];
    const now = Date.now();

    if (!liveSubInitialized) {
      otherList.forEach(ev => { if (ev && ev.id) seenLiveSubIds.add(ev.id); });
      liveSubInitialized = true;
      return;
    }

    if (callState !== "active") return;

    const fresh = otherList.filter(ev => ev && ev.id && !seenLiveSubIds.has(ev.id) && (now - ev.ts < 12000));
    fresh.forEach(ev => {
      seenLiveSubIds.add(ev.id);
      pushPartnerSubtitleItem({
        id: ev.id,
        orig: ev.orig || "",
        trans: ev.trans || ev.orig || ""
      });
    });

    if (seenLiveSubIds.size > 100) {
      seenLiveSubIds = new Set(Array.from(seenLiveSubIds).slice(-50));
    }
  }

  /* ================= 메시지 렌더링 ================= */

  function renderMessages(preserveScroll = false) {
    const msgs = roomState.messages || [];
    const total = msgs.length;
    const startIdx = Math.max(0, total - visibleMsgCount);
    const visibleSlice = msgs.slice(startIdx);

    const sig = buildRenderSig();
    if (sig === lastRenderSig) return;
    lastRenderSig = sig;

    const prevScrollTop = subtitlesEl.scrollTop;
    const latest = msgs[msgs.length - 1];
    const hasNewMsg = Boolean(latest && latest.ts && latest.ts > lastRenderedLatestTs);
    if (latest && latest.ts) lastRenderedLatestTs = Math.max(lastRenderedLatestTs, latest.ts);

    const allowPhotoAutoScroll = !preserveScroll || hasNewMsg;

    subtitlesEl.innerHTML = "";

    if (startIdx > 0) {
      const hint = document.createElement("div");
      hint.className = "load-more-hint";
      hint.textContent = `${t().loadMore} (${startIdx})`;
      hint.onclick = loadMoreMessages;
      subtitlesEl.appendChild(hint);
    }

    let lastDateKey = "";

    visibleSlice.forEach(m => {
      if (m.ts) {
        const dk = formatDateKey(m.ts);
        if (dk !== lastDateKey) {
          lastDateKey = dk;
          const divDate = document.createElement("div");
          divDate.className = "date-divider";
          divDate.textContent = formatDateDivider(m.ts);
          subtitlesEl.appendChild(divDate);
        }
      }

      if (m.type === "call_log") {
        const pill = document.createElement("div");
        pill.className = "call-log-pill";
        const durText = formatDuration(m.durationSec || 0, true);
        pill.innerHTML = `<span>${t().callLogLabel} (${durText})</span><span class="call-log-time">${formatMsgTime(m.ts)}</span>`;
        subtitlesEl.appendChild(pill);
        return;
      }

      const isMine = (m.lang === myRole);
      const isPlayingThis = (currentPlayingTs === m.ts);
      const div = document.createElement("div");
      div.className = `bubble ${isMine ? "mine" : "other"}`;
      div.dataset.ts = String(m.ts);

      if (m.replyTo && m.replyTo.text) {
        const quoteDiv = document.createElement("div");
        quoteDiv.className = "reply-quote";
        quoteDiv.textContent = `↩ ${m.replyTo.text}`;
        div.appendChild(quoteDiv);
      }

      if (m.hasVideo && !isVideoExpiredMsg(m)) {
        const videoWrap = document.createElement("div");
        const jobSt = videoJobStatusMap[m.ts];
        const isPlayable = Boolean(m.videoReady);
        videoWrap.className = "msg-video-wrap" + (isPlayable ? "" : " disabled");

        if (m.videoThumb) {
          const thumbImg = document.createElement("img");
          thumbImg.className = "msg-video-thumb";
          const shouldScrollAfterThumb = allowPhotoAutoScroll &&
            ((subtitlesEl.scrollHeight - subtitlesEl.scrollTop - subtitlesEl.clientHeight) < 320);
          thumbImg.onload = () => {
            if (shouldScrollAfterThumb) scrollToBottom(false);
          };
          thumbImg.src = m.videoThumb;
          videoWrap.appendChild(thumbImg);
        }

        const overlay = document.createElement("div");
        overlay.className = "msg-video-overlay";

        if (isPlayable) {
          const playCircle = document.createElement("div");
          playCircle.className = "msg-video-play-circle";
          playCircle.textContent = "▶";
          overlay.appendChild(playCircle);

          const durBadge = document.createElement("div");
          durBadge.className = "msg-video-badge";
          durBadge.textContent = formatDuration(m.videoDuration || 0, false);
          overlay.appendChild(durBadge);

          videoWrap.onclick = () => openVideoModal(m);
        } else {
          const stBadge = document.createElement("div");
          stBadge.className = "msg-video-badge " + (jobSt && jobSt.state === "paused" ? "paused" : "working");
          if (jobSt) {
            if (jobSt.state === "paused") {
              stBadge.textContent = t().videoPausedCall;
            } else if (jobSt.state === "transcoding") {
              stBadge.textContent = `${t().videoTranscoding} ${jobSt.progress || 0}%`;
            } else {
              stBadge.textContent = t().videoUploading;
            }
          } else {
            stBadge.textContent = isMine ? t().videoUploading : t().videoPartnerPreparing;
          }
          overlay.appendChild(stBadge);
        }

        videoWrap.appendChild(overlay);
        div.appendChild(videoWrap);
      } else if (m.hasPhoto) {
        const photoWrap = document.createElement("div");
        photoWrap.className = "msg-photo-wrap";

        const placeholder = document.createElement("div");
        placeholder.className = "photo-loading";
        placeholder.textContent = t().photoLoading;

        const img = document.createElement("img");
        img.className = "msg-photo hidden";
        img.onclick = () => openPhotoModal(m.ts);

        photoWrap.appendChild(placeholder);
        photoWrap.appendChild(img);
        div.appendChild(photoWrap);
        loadPhotoIntoImg(m.ts, img, placeholder, allowPhotoAutoScroll);
      } else {
        const topDiv = document.createElement("div");
        topDiv.className = "bubble-top";

        const transDiv = document.createElement("div");
        transDiv.className = "translated";
        const origDiv = document.createElement("div");
        origDiv.className = "original";

        if (m.untranslated) {
          if (isMine) {
            transDiv.textContent = m.original || "";
            origDiv.textContent = t().waitingPartnerTranslate;
          } else if (translatingIncomingSet.has(m.ts)) {
            transDiv.textContent = t().micTranslating;
            origDiv.textContent = m.original || "";
          } else {
            transDiv.textContent = m.original || "";
            origDiv.textContent = t().untranslatedHint;
          }
        } else {
          transDiv.textContent = m.translated || "";
          origDiv.textContent = m.original || "";
        }
        topDiv.appendChild(transDiv);

        if (m.hasAudio || (m.audioData && m.audioMime)) {
          const durSec = m.audioDuration || audioDurationCache[m.ts] || 0;
          const isUploading = Boolean(m.hasAudio && m.audioReady === false);
          const playBtn = document.createElement("button");
          playBtn.className = "play-btn" + (isPlayingThis ? " playing" : "") + (isUploading ? " uploading" : "");
          playBtn.disabled = isUploading;
          playBtn.dataset.ts = String(m.ts);
          playBtn.dataset.dur = String(durSec);
          playBtn.innerHTML = buildPlayBtnHTML(isPlayingThis, durSec, isUploading);
          playBtn.onclick = () => { if (!isUploading) toggleAudio(m); };
          topDiv.appendChild(playBtn);

        div.appendChild(topDiv);
        div.appendChild(origDiv);
      }

      const footerDiv = document.createElement("div");
      footerDiv.className = "bubble-footer";

      const timeDiv = document.createElement("div");
      timeDiv.className = "msg-time";
      timeDiv.textContent = m.ts ? formatMsgTime(m.ts) : "";
      footerDiv.appendChild(timeDiv);

      const actDiv = document.createElement("div");
